<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<base target="_top">
<title>日程調整｜管理</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#e3e6ec;--line2:#cfd4dc;
  --accent:#2563eb;--accent-ink:#fff;--accent-soft:#e8f0ff;
  --ok:#0e9f6e;--ok-soft:#e3f6ee;--warn:#b54708;--warn-soft:#fff4e5;--danger:#d92d20;--danger-soft:#fdecea;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116;--card:#161a22;--ink:#e7eaf0;--sub:#9aa4b2;--line:#272d38;--line2:#3a4250;
  --accent:#7aa7ff;--accent-ink:#0b1220;--accent-soft:#1a2540;
  --ok:#3ecf8e;--ok-soft:#12261d;--warn:#f0a35e;--warn-soft:#2a1f12;--danger:#ff7a6e;--danger-soft:#2b1614;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:72px}
.muted{color:var(--sub)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--line2);border-radius:8px;
  background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default;border-color:var(--line2);color:var(--sub)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{border-color:transparent;background:transparent;color:var(--danger)}
.btn.danger-ghost:hover{background:var(--danger-soft);color:var(--danger)}
.btn.danger.danger-ghost,.btn.danger.danger-ghost:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{padding:12px 22px;font-size:16px}
.btn.small{padding:5px 10px;font-size:13px}
.icon-btn{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}

/* お知らせ */
.alert{padding:10px 14px;border-radius:8px;background:var(--danger-soft);color:var(--danger);margin:0 0 14px}
.banner{padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);margin:0 0 14px}
.note{padding:12px 14px;border-radius:8px;background:var(--bg);white-space:pre-wrap;margin:14px 0}
.warn{padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:10px 0 0;font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  box-shadow:var(--shadow);z-index:50;max-width:90vw;font-size:14px}
.toast.is-bad{background:var(--danger);color:#fff}
.spinner{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mockbar{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:8px;margin:0 0 14px;font-size:14px}

/* 週の表（相手の画面・候補選びで共通） */
.wk-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.wk-label{font-weight:600}
.wk-nav{width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;background:var(--card);cursor:pointer;font-size:20px;line-height:1}
.wk-nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.wk-nav:disabled{opacity:.35;cursor:default}
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-head{text-align:center;padding:6px 0 8px;border-bottom:2px solid var(--line);margin:0 0 8px;display:flex;flex-direction:column;line-height:1.3}
.wk-dow{font-size:12px;color:var(--sub)}
.wk-num{font-weight:600}
.is-sat .wk-dow{color:#3b82f6}.is-sun .wk-dow{color:#ef4444}
.is-today .wk-head{border-bottom-color:var(--accent)}
.wk-slots{display:flex;flex-direction:column;gap:6px}
.wk-none{display:block;text-align:center;color:var(--line2)}
.slot{padding:8px 0;border:1px solid var(--line2);border-radius:8px;background:var(--card);cursor:pointer;font-variant-numeric:tabular-nums;text-align:center}
.slot:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slot.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.wk-jump{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 0 4px;color:var(--sub)}
/* 右上の「リスト／カレンダー」の切り替え */
.wk-top{display:flex;justify-content:flex-end;margin:0 0 8px}
.wk-views{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.wk-view{border:0;background:var(--card);color:var(--sub);padding:5px 14px;font-size:13px;cursor:pointer}
.wk-view+.wk-view{border-left:1px solid var(--line2)}
.wk-view.is-on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* カレンダーの見せ方: 縦に時刻、横に 7 日 */
.wkc{overflow-x:auto}
.wkc-heads,.wkc-body{display:grid;grid-template-columns:44px repeat(7,minmax(40px,1fr));min-width:340px}
.wkc-head .wk-head{margin:0 0 4px;align-items:center;text-align:center}
.wkc-body{border-top:1px solid var(--line)}
.wkc-axis{position:relative}
.wkc-axis span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.wkc-axis span:first-child{transform:none}
.wkc-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.wkc-col.is-today{background-color:var(--accent-soft)}
.wk .wkc-blk.slot{position:absolute;left:2px;right:2px;padding:1px 4px;font-size:12px;line-height:1.2;text-align:left;display:flex;align-items:flex-start;overflow:hidden;border-radius:6px}
.wk .wkc-blk.slot{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.wk .wkc-blk.slot:hover{background:var(--accent);color:var(--accent-ink)}
.wk .wkc-blk.slot.is-on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--card) inset}

/* 相手の画面 */
.g-wrap{max-width:1040px;margin:0 auto;padding:28px 16px 40px}
.g-loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:120px 0;color:var(--sub)}
.g-card{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.g-info{padding:28px 24px;border-right:1px solid var(--line)}
.g-host{color:var(--sub);font-size:14px;margin:0 0 4px}
.g-title{font-size:21px;line-height:1.4;margin:0 0 16px}
.g-meta{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.g-meta > div{display:flex;gap:10px;align-items:flex-start;color:var(--sub)}
.g-meta .ic{margin-top:3px}
.g-meta strong{color:var(--ink);font-weight:600}
.g-meta select{padding:5px 8px;font-size:13px}
.g-desc{white-space:pre-wrap;color:var(--sub);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.g-picked{margin:0 0 16px;padding:12px 14px;border-radius:8px;background:var(--accent-soft)}
.g-picked b{display:block;font-size:16px}
.g-main{padding:28px 24px;min-width:0}
.g-h2{font-size:17px;margin:0 0 16px}
.g-form .field{display:block;margin:0 0 14px}
.field-label{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-weight:600;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.tag.req{background:var(--danger-soft);color:var(--danger)}
.tag.opt{background:var(--bg);color:var(--sub)}
.g-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.g-actions.wrap{justify-content:flex-start;flex-wrap:wrap}
.g-done{text-align:center}
.g-done .kv{text-align:left}
.done-icon{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:8px auto 14px}
.done-icon .ic{width:30px;height:30px;stroke-width:2.4}
.done-icon.is-off{background:var(--bg);color:var(--sub)}
.kv{border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden}
.kv > div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.kv > div:first-child{border-top:0}
.kv dt{color:var(--sub);font-size:14px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv .sub{color:var(--sub);font-size:13px}
.g-foot{display:flex;justify-content:center;gap:14px;padding:16px 0 0;color:var(--sub);font-size:13px}
.g-foot button{border:0;background:none;color:var(--sub);cursor:pointer;text-decoration:underline;padding:0}
.g-error{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:56px 24px;text-align:center}
.g-error h2{font-size:18px;margin:0 0 8px}
/* 自前のページの「Google でログイン」 */
.login-btn{display:flex;flex-direction:column;align-items:center;margin:18px 0 4px;min-height:44px}

/* 管理画面 */
.a-shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.a-nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.a-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 10px 14px}
.a-navitem{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--sub)}
.a-navitem:hover{background:var(--bg);color:var(--ink)}
.a-navitem.is-on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.a-mock{margin-top:auto;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px}
.a-mock small{display:block;font-weight:400;line-height:1.5;margin-top:2px}
.a-main{padding:26px 28px 120px;max-width:980px;width:100%}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.a-head h1{font-size:21px}
.a-back{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 14px}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.off{background:var(--bg);color:var(--sub)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.sc.is-off{opacity:.72}
.sc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sc-top h2{font-size:17px;flex:1;min-width:160px}
.sc-actions{display:flex;gap:6px;flex-wrap:wrap}
.sc-meta{color:var(--sub);font-size:14px;margin:6px 0 12px}
.urlrow{display:flex;gap:8px;align-items:center}
.urlrow input{flex:1;min-width:0;font-size:13px;color:var(--sub);background:var(--bg)}
.sc-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.sec h2{font-size:16px;margin:0 0 4px}
.sec > .muted{font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.sec h2 + .row,.sec > .muted + .row{border-top:0}
.row-label{font-weight:600;font-size:14px;padding-top:8px}
.hint{color:var(--sub);font-size:13px;margin-top:5px}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline > select,.inline > input{width:auto}
.numwrap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.num{width:84px !important}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 0}
.check input{margin-top:5px;flex:none}
.check small{color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin:7px 0 0;flex:none}
.calgroup{margin:0 0 10px}
.calgroup-head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin:0 0 2px}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:5px 0;flex-wrap:wrap}
.hday{width:52px;font-weight:600;padding-top:7px}
.hranges{display:flex;flex-direction:column;gap:6px;flex:1;min-width:230px}
.hrange{display:flex;align-items:center;gap:6px}
.hrange select{width:104px}
.hranges .muted{padding-top:7px}
.hours-tools{margin-top:6px}
.savebar{position:fixed;left:220px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 28px;display:flex;gap:14px;align-items:center;z-index:20}
.preview{flex:1;font-size:14px;color:var(--sub);min-width:0}
.preview.is-warn{color:var(--warn)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.sellist{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px;margin:10px 0}
.mail{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:8px;padding:12px 14px;margin-top:8px;overflow-wrap:anywhere}
.mail-head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.mail-head b{flex:1;min-width:200px}

@media (max-width:820px){
  .g-wrap{padding:12px 10px 28px}
  .g-card{grid-template-columns:1fr}
  .g-info{border-right:0;border-bottom:1px solid var(--line);padding:20px 18px}
  .g-main{padding:20px 18px}
  .wk-grid{grid-template-columns:1fr;gap:0}
  .wk-day{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
  .wk-day.is-empty{padding:6px 0;opacity:.55}
  .wk-head{border-bottom:0;margin:0;padding:4px 0;text-align:left}
  .is-today .wk-num{color:var(--accent)}
  .wk-slots{flex-direction:row;flex-wrap:wrap}
  .wk-none{text-align:left;padding-top:8px}
  .slot{padding:8px 14px}
  .g-actions{flex-direction:column-reverse;align-items:stretch}
  .a-shell{grid-template-columns:1fr}
  .a-nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .a-brand{padding:4px 10px;width:100%}
  .a-mock{margin:0;width:100%}
  .a-main{padding:18px 14px 150px}
  .row{grid-template-columns:1fr;gap:4px}
  .row-label{padding-top:0}
  .savebar{left:0;padding:10px 14px;flex-wrap:wrap}
  .preview{flex-basis:100%}
}

/* ===== カレンダー画面（Google カレンダーの並び） ===== */
.a-cal{height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.cal{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg);color:var(--ink);--gut:56px;--hour:48px}
.cal-top{display:flex;align-items:center;gap:4px;height:64px;padding:0 12px 0 8px;flex:none;position:relative}
.cal-progress{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden;display:none}
.cal-progress.is-on{display:block}
.cal-progress::after{content:"";position:absolute;left:-40%;width:40%;height:100%;background:var(--accent);animation:cal-slide 1.1s linear infinite}
@keyframes cal-slide{to{left:100%}}
.cal-ib{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.cal-ib:hover{background:var(--line);color:var(--ink)}
.cal-ib .ic{width:20px;height:20px}
.cal-ib.is-busy .ic{animation:spin .9s linear infinite}
.cal-brand{display:flex;align-items:center;gap:10px;margin:0 20px 0 4px;font-size:22px;color:var(--ink);white-space:nowrap}
.cal-logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.cal-mockbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.cal-pill{height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.cal-pill:hover{background:var(--line)}
.cal-pill.is-on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.cal-pill .ic{width:18px;height:18px}
.cal-title{font-size:22px;font-weight:400;margin:0 0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.cal-top-r{display:flex;align-items:center;gap:8px;flex:none}
.cal-seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;height:36px}
.cal-seg-b{border:0;background:transparent;color:var(--ink);padding:0 14px;cursor:pointer;font-size:14px}
.cal-seg-b + .cal-seg-b{border-left:1px solid var(--line2)}
.cal-seg-b.is-on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal-links{display:flex;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line)}
.cal-link{border:0;background:transparent;color:var(--sub);padding:8px 10px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap;text-align:left}
.cal-link:hover{background:var(--line);color:var(--ink)}
/* メニューのうち、ほかのページへ移るもの（タスク管理・マイエージェント）は <a> */
a.cal-link,a.a-navitem{text-decoration:none;display:block}

.cal-body{display:flex;flex:1;min-height:0}
.cal-side{width:256px;flex:none;padding:4px 8px 16px 14px;overflow-y:auto;display:none}
.cal.has-side .cal-side{display:block}
.cal-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;margin:0 12px 0 0;overflow:hidden;position:relative}
.cal-loading{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;color:var(--sub);padding:24px}
.cal-loaderr{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 14px;background:var(--danger-soft);color:var(--danger);font-size:13px;flex:none}

/* 左の列 */
.cal-create{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px 0 14px;border:0;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:500;margin:8px 0 18px}
.cal-create:hover{box-shadow:0 2px 6px rgba(16,24,40,.2),0 12px 32px rgba(16,24,40,.14)}
.cal-create-plus{display:inline-flex}
.cal-create-plus .ic{width:24px;height:24px;color:var(--accent);stroke-width:2.2}
.cal-mini{margin:0 0 14px}
.cal-mini-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 2px 8px;font-size:14px;font-weight:500}
.cal-mini-nav{display:inline-flex}
.cal-mini-nav .cal-ib{width:28px;height:28px}
.cal-mini-nav .ic{width:16px;height:16px}
.cal-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-mini-dow{text-align:center;font-size:10px;color:var(--sub);height:24px;line-height:24px}
.cal-mini-d{height:28px;width:28px;margin:0 auto;border:0;background:transparent;color:var(--ink);font-size:10px;cursor:pointer;border-radius:50%;padding:0;display:block}
.cal-mini-d:hover{background:var(--line)}
.cal-mini-d.is-out{color:var(--sub);opacity:.75}
.cal-mini-d.is-range{background:var(--accent-soft)}
.cal-mini-d.is-today{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-group{margin:0 0 6px}
.cal-group-h{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:500;padding:8px;cursor:pointer;border-radius:8px}
.cal-group-h:hover{background:var(--line)}
.cal-group-h .ic{width:18px;height:18px;transition:transform .15s}
.cal-group.is-fold .cal-group-h .ic{transform:rotate(-90deg)}
.cal-li{display:flex;align-items:center;height:32px;border-radius:8px;padding:0 0 0 6px;position:relative}
.cal-li:hover{background:var(--line)}
.cal-li-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;height:100%}
.cal-li-in{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.cal-li-box{width:18px;height:18px;border-radius:3px;border:2px solid var(--c);background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cal-li-box .ic{width:14px;height:14px;stroke-width:3}
.cal-li:not(.is-on) .cal-li-box{background:transparent}
.cal-li:not(.is-on) .cal-li-box .ic{display:none}
.cal-li-in:focus-visible + .cal-li-box{outline:2px solid var(--accent);outline-offset:2px}
.cal-li-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-li-err{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;flex:none;margin-left:4px;white-space:nowrap}
.cal-li-more{width:28px;height:28px;opacity:0;flex:none}
.cal-li:hover .cal-li-more,.cal-li-more:focus-visible{opacity:1}
.cal-li-more .ic{width:18px;height:18px}
.cal-side-links{display:none;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cal-mock{margin-top:14px}
.cal-back{display:none}

/* 週・日の表 */
.cal-grid{display:flex;flex-direction:column;flex:1;min-height:0}
.cal-head{display:flex;flex:none}
.cal-gut{width:var(--gut);flex:none;position:relative}
.cal-hd{flex:1;min-width:0;text-align:center;padding:8px 0 4px;border-left:1px solid var(--line)}
.cal-hd-dow{font-size:11px;color:var(--sub);line-height:16px}
.cal-hd.is-today .cal-hd-dow{color:var(--accent)}
.cal-hd-num{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:26px;cursor:pointer;line-height:46px;padding:0;margin:2px 0 0}
.cal-hd-num:hover{background:var(--line)}
.cal-hd.is-today .cal-hd-num{background:var(--accent);color:var(--accent-ink)}
.cal-allday{display:flex;flex:none;border-bottom:1px solid var(--line)}
.cal-gut-tz{font-size:10px;color:var(--sub);text-align:right;padding:4px 10px 0 0;white-space:nowrap}
.cal-bns{flex:1;min-width:0;position:relative;display:flex;max-height:130px;overflow-y:auto}
.cal-bn-cell{flex:1;min-width:0;border-left:1px solid var(--line);cursor:pointer}
.cal-bn{position:absolute;height:22px;line-height:20px;border-radius:4px;padding:0 8px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid var(--card);box-sizing:border-box;background:var(--c);color:#fff}
.cal-bn.is-clipl{border-top-left-radius:0;border-bottom-left-radius:0;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);padding-left:14px}
.cal-bn.is-clipr{border-top-right-radius:0;border-bottom-right-radius:0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-right:14px}
.cal-bn.is-clipl.is-clipr{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
.cal-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.cal-time{display:flex;position:relative}
.cal-gutter{width:var(--gut);flex:none;position:relative}
.cal-gutter::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.cal-hour{position:absolute;right:14px;transform:translateY(-50%);font-size:10px;color:var(--sub);line-height:1;white-space:nowrap}
.cal-days{flex:1;min-width:0;display:grid;position:relative;background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hour);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.cal-daycol{position:relative;border-left:1px solid var(--line);min-width:0}
.cal-evs{position:absolute;left:0;right:12px;top:0;bottom:0}
.cal-ev{position:absolute;box-sizing:border-box;border-radius:6px;border:1px solid var(--card);padding:2px 6px 0;font-size:12px;line-height:14px;overflow:hidden;cursor:pointer;background:var(--c);color:#fff;min-height:11px}
.cal-ev.is-edit:active{cursor:grabbing}
.cal-ev-t{font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.cal-ev-t.is-one{display:block;white-space:nowrap;text-overflow:ellipsis;-webkit-line-clamp:none}
.cal-ev-s{font-size:11px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev-t.is-one .cal-ev-s{font-weight:400}
.cal-ev.is-tiny{padding:0 4px;font-size:10px;line-height:10px}
.cal-ev.is-outline,.cal-bn.is-outline,.cal-chip.is-fill.is-outline{background:var(--card);color:var(--ink);border-color:var(--c)}
.cal-ev.is-declined .cal-ev-t,.cal-bn.is-declined,.cal-chip.is-declined .cal-chip-t{text-decoration:line-through;opacity:.7}
.cal-ev.is-maybe,.cal-bn.is-maybe{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 4px,transparent 4px 9px)}
.cal-ev.is-saving,.cal-bn.is-saving,.cal-chip.is-saving{opacity:.65}
.cal-ev-rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.cal-ev.is-draft,.cal-ev.is-ghost{left:0 !important;right:12px;width:auto !important;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:.96}
.cal-bn.is-draft{box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
.cal-ev.is-dragging{opacity:.35}
.cal.is-dragging,.cal.is-dragging *{cursor:grabbing !important}
.cal.is-dragging .cal-ev-rs{cursor:ns-resize !important}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--danger)}

/* 小さな窓・一覧のメニュー */
.cal-layer{position:fixed;inset:0;z-index:60;pointer-events:none}
.cal-pop{position:absolute;pointer-events:auto;background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15),0 12px 40px rgba(0,0,0,.25);width:400px;max-width:calc(100vw - 16px);padding:8px 16px 16px;max-height:calc(100vh - 16px);box-sizing:border-box}
.cal-pop.cal-detail{overflow:auto}
.cal-pop.is-sheet{left:0 !important;right:0;bottom:0;top:auto !important;width:auto;max-width:none;border-radius:16px 16px 0 0;max-height:85vh}
.cal-pop-bar{display:flex;justify-content:flex-end;gap:2px;margin:0 -8px 2px 0}
input.cal-q-title{width:100%;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;font-size:22px;padding:4px 0 8px;margin:0 0 10px;color:var(--ink)}
input.cal-q-title:focus{box-shadow:none;border-bottom:2px solid var(--accent);padding-bottom:7px}
.cal-q-row{display:flex;align-items:flex-start;gap:12px;margin:8px 0;color:var(--sub)}
.cal-q-row > .ic{flex:none;margin-top:9px}
.cal-q-row > div{flex:1;min-width:0}
.cal-trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--ink)}
input.cal-date{width:148px;padding:6px 8px;font-size:14px}
select.cal-time{width:auto;padding:6px 24px 6px 8px;font-size:14px}
.cal-tsep{color:var(--sub)}
.cal-allday-ck{display:inline-flex;align-items:center;gap:6px;margin-left:4px;font-size:14px;cursor:pointer;white-space:nowrap}
.cal-pick-wrap{position:relative;min-width:0}
.cal-pick{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer;max-width:100%;font-size:14px}
.cal-pick:hover{background:var(--line)}
.cal-pick-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-pick .ic{width:16px;height:16px;color:var(--sub);flex:none}
.cal-pick-menu{position:absolute;left:0;top:100%;z-index:5;background:var(--card);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;min-width:260px;max-height:260px;overflow:auto}
.cal-pick-menu.is-up{top:auto;bottom:100%}
.cal-pick-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
.cal-pick-item:hover,.cal-pick-item.is-on{background:var(--accent-soft)}
.cal-pick-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.cal-err{color:var(--danger);font-size:13px;margin:6px 0 0}
.cal-pop-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px}
.btn.cal-save,.cal-dlg-actions .btn{border-radius:999px}
.cal-calmenu{width:auto;padding:6px}
.cal-menu-item{display:block;width:100%;border:0;background:transparent;color:var(--ink);padding:8px 12px;text-align:left;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.cal-menu-item:hover{background:var(--line)}
.cal-menu-sep{height:1px;background:var(--line);margin:6px 0}
.cal-swatches{display:grid;grid-template-columns:repeat(6,24px);gap:8px;padding:8px 6px 6px}
.cal-sw{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:0}
.cal-sw:hover{transform:scale(1.1)}
.cal-sw .ic{width:14px;height:14px;stroke-width:3}
.cal-sw:not(.is-on) .ic{display:none}

/* 中身の窓・編集の窓・削除の知らせ */
.cal-d-head{display:flex;gap:14px;align-items:flex-start;margin:0 0 8px}
.cal-d-sq{width:16px;height:16px;border-radius:4px;flex:none;margin-top:7px}
.cal-d-headtext{min-width:0;flex:1}
.cal-d-title{font-size:22px;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.cal-d-title.is-declined{text-decoration:line-through;color:var(--sub)}
.cal-d-when{color:var(--sub);font-size:14px;margin-top:2px}
.cal-d-sub{color:var(--sub);font-size:12px;overflow-wrap:anywhere;display:flex;align-items:center;gap:4px;margin-top:2px}
.cal-d-sub .ic{width:14px;height:14px}
.cal-d-row{display:flex;gap:14px;align-items:flex-start;padding:6px 0;font-size:14px;overflow-wrap:anywhere}
.cal-d-row > .ic{flex:none;color:var(--sub);margin-top:2px}
.cal-d-row > div{min-width:0;flex:1}
.cal-d-cal{display:inline-flex;align-items:center;gap:8px}
.cal-d-desc{white-space:pre-wrap;max-height:200px;overflow:auto;font-size:14px}
.cal-d-lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--sub)}
.cal-d-lock .ic{flex:none}
.cal-d-lock span{flex:1;min-width:160px}
.cal-d-foot{margin-top:10px;font-size:13px}
.cal-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.cal-dialog{background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:620px;max-width:100%;max-height:100%;display:flex;flex-direction:column}
.cal-dlg-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0 24px}
.cal-dlg-h{font-size:14px;color:var(--sub)}
.cal-dlg-body{padding:0 24px 8px;overflow:auto;flex:1}
.cal-dlg-row{display:flex;gap:14px;align-items:flex-start;padding:8px 0}
.cal-dlg-row > .ic{flex:none;color:var(--sub);margin-top:8px}
.cal-dlg-row > div,.cal-dlg-row > input,.cal-dlg-row > textarea{flex:1;min-width:0}
.cal-sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}
.cal-sws-label{font-size:13px;color:var(--sub);margin-left:4px}
.cal-dlg-checks{padding:4px 0 0 38px}
.cal-dlg-checks small{display:block;color:var(--sub);font-size:12px}
.cal-note{font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 12px;margin:6px 0}
.cal-dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:8px 24px 16px}
.cal-snack{position:fixed;left:24px;bottom:24px;z-index:65;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 48px)}
.cal-snack-act{border:0;background:transparent;color:#8ab4f8;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:4px;white-space:nowrap}
.cal-snack-act:hover{background:rgba(255,255,255,.12)}

/* 月の表 */
.cal-month{display:flex;flex-direction:column;flex:1;min-height:0}
.cal-mhead{display:grid;flex:none;height:28px;align-items:end}
.cal-mhead-d{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px}
.cal-mbody{display:flex;flex-direction:column;flex:1;min-height:0}
.cal-mweek{display:grid;flex:1;min-height:0;position:relative;border-top:1px solid var(--line)}
.cal-mcell{border-left:1px solid var(--line);min-width:0;text-align:center;padding-top:2px;cursor:pointer;overflow:hidden}
.cal-mcell:first-child{border-left:0}
.cal-mcell.is-out .cal-mnum{color:var(--sub)}
.cal-mnum{border:0;background:transparent;color:var(--ink);font-size:12px;height:24px;min-width:24px;padding:0 6px;border-radius:12px;cursor:pointer;line-height:24px;white-space:nowrap}
.cal-mnum:hover{background:var(--line)}
.cal-mcell.is-today .cal-mnum{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-chip{position:absolute;height:20px;line-height:20px;font-size:12px;border-radius:4px;padding:0 4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:4px;box-sizing:border-box;color:var(--ink)}
.cal-chip.is-dot:hover{background:var(--line)}
.cal-chip.is-dot.is-past{color:var(--sub)}
.cal-chip.is-dot .cal-dot{width:8px;height:8px;margin-left:2px}
.cal-chip-time{flex:none}
.cal-chip-t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.cal-chip.is-fill{display:block;background:var(--c);color:#fff;padding:0 6px;font-weight:500;border:1px solid var(--card)}
.cal-chip.is-fill.is-clipl{border-top-left-radius:0;border-bottom-left-radius:0;clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);padding-left:12px}
.cal-chip.is-fill.is-clipr{border-top-right-radius:0;border-bottom-right-radius:0;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%);padding-right:12px}
.cal-chip.is-fill.is-clipl.is-clipr{clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%)}
.cal-chip.is-draft{box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
.cal-more{position:absolute;height:20px;line-height:20px;font-size:12px;font-weight:500;border:0;background:transparent;color:var(--ink);text-align:left;padding:0 6px;cursor:pointer;border-radius:4px;white-space:nowrap;overflow:hidden}
.cal-more:hover{background:var(--line)}

/* 時間の配分（右の列） */
.cal-alloc{width:340px;flex:none;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;margin-right:12px;display:flex;flex-direction:column;min-height:0}
.cal-alloc[hidden]{display:none}
.cal.has-alloc .cal-main{margin-right:8px}
.cal-al-head{padding:10px 16px 0;flex:none}
.cal-al-bar{display:flex;align-items:center;justify-content:space-between}
.cal-al-bar h2{font-size:16px;font-weight:500}
.cal-al-range{display:flex;align-items:center;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
input.cal-al-date{width:128px;padding:5px 6px;font-size:13px}
.cal-al-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.cal-al-tools .check{padding:0;align-items:center}
.cal-al-tools .check input{margin:0}
.cal-al-body{padding:6px 16px 16px;overflow:auto;flex:1;min-height:0}
.cal-al-period{font-size:13px;color:var(--sub);margin:4px 0 8px}
.cal-al-bar2{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:0 0 10px}
.cal-al-bar2 span{display:block;height:100%}
.cal-al-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.cal-al-table th{text-align:left;color:var(--sub);font-weight:500;padding:4px 3px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px}
.cal-al-table td{padding:5px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.cal-al-table th:first-child,.cal-al-table td:first-child{width:100%;max-width:0}
.cal-al-table .num{text-align:right;white-space:nowrap}
.cal-al-nm{display:flex;align-items:center;gap:6px;min-width:0}
.cal-al-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-al-total td{font-weight:600;border-bottom:0}
.cal-al-note{font-size:11px;color:var(--sub);margin:8px 0 0;line-height:1.5}
.cal-al-warn{font-size:12px}
.cal-al-actions{margin-top:10px;display:flex;gap:8px}
.cal-al-empty{color:var(--sub);font-size:13px;padding:12px 0}

/* 勤務場所（06_機能要件_勤務場所.md）: 日付の下の札・時刻の列の右の余白の帯・月の表の印・小窓。色は種類で決まる */
.cal{--wl-home:#188038;--wl-office:#1967d2;--wl-other:#5f6368}
@media (prefers-color-scheme:dark){.cal{--wl-home:#81c995;--wl-office:#8ab4f8;--wl-other:#bdc1c6}}
.k-home{--wlc:var(--wl-home)}.k-office{--wlc:var(--wl-office)}.k-other{--wlc:var(--wl-other)}
.cal-wlrow{display:flex;flex:none;border-bottom:1px solid var(--line)}
.cal-gut-wl{font-size:10px;color:var(--sub);text-align:right;padding:5px 10px 0 0;white-space:nowrap}
.cal-wlc{flex:1;min-width:0;display:flex;align-items:center;gap:3px;height:24px;padding:0 4px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font-size:11px;line-height:1;cursor:pointer;overflow:hidden;text-align:left}
.cal-wlc:hover,.cal-wlc:focus-visible{background:var(--line);outline:none}
.cal-wlc-add{display:inline-flex;align-items:center;gap:2px;color:var(--sub);opacity:0}
.cal-wlc-add .ic{width:12px;height:12px}
.cal-wlc:hover .cal-wlc-add,.cal-wlc:focus-visible .cal-wlc-add{opacity:1}
.cal-wlchip{display:inline-flex;align-items:center;gap:3px;min-width:0;height:18px;padding:0 6px 0 4px;border-radius:9px;border:1px solid transparent;background:color-mix(in srgb,var(--wlc) 13%,transparent);color:var(--wlc);font-weight:600;white-space:nowrap;overflow:hidden}
.cal-wlchip .ic{width:12px;height:12px}
.cal-wlchip-t{overflow:hidden;text-overflow:ellipsis}
.cal-wlchip.is-pat{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--wlc) 55%,transparent);font-weight:500}
.cal-wlchip.is-g{background:transparent;border-color:color-mix(in srgb,var(--wlc) 40%,transparent);font-weight:500}
.cal-wlchip.is-small{padding:0 3px;flex:none}
.cal-wlchip.is-multi{padding:0 4px;gap:2px;flex:none;background:transparent;border-color:var(--line2)}
.cal-wlchip-i{display:inline-flex;color:var(--wlc)}
.cal-wl-g{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:3px;background:var(--sub);color:var(--card);font-size:9px;font-weight:700;line-height:1;flex:none}
.cal-wl-g.is-ok{background:transparent;color:var(--sub);border:1px solid var(--line2)}
.cal-wl-clash{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;flex:none}
.cal-wlbars{position:absolute;right:1px;top:0;bottom:0;width:9px;pointer-events:none;z-index:1}
.cal-wlbar{position:absolute;right:3px;width:3px;border-radius:2px;background:var(--wlc)}
.cal-wlbars.is-two .cal-wlbar.is-own{right:5px}
.cal-wlbar.is-pat{opacity:.5}
.cal-wlbar.is-g{right:1px;opacity:.55}
.cal-wlbar.is-clash{right:0;width:9px;border-radius:0;background:repeating-linear-gradient(180deg,var(--danger) 0 3px,transparent 3px 6px);opacity:.75}
.cal-mcell{position:relative}
.cal-mwl{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--wlc);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

.cal-mwl .ic{width:14px;height:14px}

.cal-wl-toggle{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink)}

.cal-wl-toggle .ic{width:16px;height:16px;color:var(--wl-home)}
.cal-wlpop{width:380px}
.cal-wl-h{font-size:16px;font-weight:600;margin:0 0 8px}
.cal-wl-sec{margin:0 0 8px}
.cal-wl-cap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin:0 0 4px}
.cal-wl-types{display:flex;gap:6px;flex-wrap:wrap}
.cal-wl-qb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:1px solid var(--line2);border-radius:15px;background:var(--card);color:var(--ink);cursor:pointer;font-size:13px}

.cal-wl-qb:hover{background:var(--line)}

  .cal-side-links{display:flex}
}

}

  //   own   = 自分の記録 ＋ いつもの形（その日に自分の終日の記録が無い時だけ、いつもの形がその日の基本になる）

  // ---- 置く時の決め（同じ段の、後から置いた方が勝つ） ----
  // existing: 自分の記録（own）の配列。rec: 置く物 { id?, allDay, startDate, endDate } か { id?, allDay: false, start, end }
  // 返す: 前の記録への手当ての並び
  //   { op: 'remove', id } / { op: 'update', id, …新しい時 } / { op: 'insert', of: 元の id, type, label, …時 }

      if (keepR) {
        if (keepL) out.push(times({ op: 'insert', of: x.id, type: x.type, label: x.label }, rec.allDay, re, xe));   // 真ん中に置いた: 2 つに分ける
        else out.push(times({ op: 'update', id: x.id }, rec.allDay, re, xe));
      }

  };

<script>
// ---- web/js/backend-http.js ----
// 自前のページ（workspace.glowball-ec.com）用の裏側。GAS の JSON の窓口（doPost）を fetch で呼ぶ。
// GAS の画面ではないので、Google の「このアプリケーションは…」の帯が出ない。
// 管理の操作には持ち主の証を付ける。この端末のログインの印（session。30 日）があればそれ、無ければ「Google でログイン」の証（ID トークン）。
// どちらも admin.js が入れる。付けないのは相手向けの操作（guest.*）だけ（操作の名前で選ぶと、新しく足した操作に付け忘れる）
var Backend = {
  mode: 'web',
  exec: (window.NC_WEB && window.NC_WEB.exec) || '',
  idToken: '',
  session: '',
  call: function (action, payload) {
    var body = {}, k;
    payload = payload || {};
    for (k in payload) if (Object.prototype.hasOwnProperty.call(payload, k)) body[k] = payload[k];
    if (!/^guest\./.test(String(action))) {
      if (Backend.session) body.session = Backend.session;
      else if (Backend.idToken) body.idToken = Backend.idToken;
    }
    // text/plain で送る（JSON の型にすると、ブラウザが事前の問い合わせを挟み、GAS がそれに答えられない）
    return fetch(Backend.exec, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: body }), redirect: 'follow' })
      .then(function (res) { return res.text(); }, function () {
        throw { code: 'network', message: '通信できませんでした。もう一度お試しください。' };
      })
      .then(function (text) {
        var r;
        try { r = JSON.parse(text); } catch (e) { throw { code: 'internal', message: '返事を読めませんでした。もう一度お試しください。' }; }
        if (r && r.ok) return r.data;
        throw (r || { code: 'internal', message: '' });
      });
  }
};

    function pct(x, total) { return total > 0 ? Math.round(x / total * 100) + '%' : '—'; }
    function allocBody(r) {
      var from = dayStart(r.a), to = dayStart(NC.addDays(r.b, 1)), days = NC.dayDiff(r.a, r.b) + 1;
      var out = [h('div', { class: 'cal-al-period', 'data-period': r.a + '/' + r.b }, fmtMd(r.a) + (r.a === r.b ? '' : ' 〜 ' + fmtMd(r.b)) + '（' + days + ' 日間）')];
      if (S.alloc.err) out.push(h('div', { class: 'cal-err' }, S.alloc.err));
      if (!covered(from, to)) { out.push(h('div', { class: 'cal-al-empty' }, h('div', { class: 'spinner', style: 'display:inline-block;vertical-align:middle;margin-right:8px' }), '数えています…')); return out; }
      var ids = S.cals.filter(function (c) { return S.visible[c.id]; }).map(function (c) { return c.id; });
      var list = Object.keys(S.store).filter(function (k) { return !S.hidden[k]; }).map(function (k) { return S.store[k]; });
      var res = NC.allocate(list, { from: from, to: to, tz: S.tz, ownEmails: S.own, mineOnly: S.alloc.mine, calIds: ids });
      var totalAll = res.rows.reduce(function (p, x) { return p + x.allDay; }, 0);
      if (res.totalRealMin > 0) {
        out.push(h('div', { class: 'cal-al-bar2', 'aria-hidden': 'true' }, res.rows.filter(function (x) { return x.realMin > 0; }).map(function (x) {
          return h('span', { style: 'width:' + (x.realMin / res.totalRealMin * 100) + '%;background:' + colorOf(S.calBy[x.calId]), title: nameOf(x.calId) + ' ' + pct(x.realMin, res.totalRealMin) });
        })));
      }
      if (res.rows.length) {
        out.push(h('table', { class: 'cal-al-table' },
          h('thead', null, h('tr', null, h('th', null, 'カレンダー'), h('th', { class: 'num' }, '入っている'), h('th', { class: 'num' }, '実際'), h('th', { class: 'num' }, '割合'), h('th', { class: 'num' }, '終日'))),
          h('tbody', null, res.rows.map(function (x) {
            var name = nameOf(x.calId);
            return h('tr', { 'data-alloc': x.calId, 'data-simple': String(x.simpleMin), 'data-real': String(Math.round(x.realMin * 100) / 100) },
              h('td', null, h('div', { class: 'cal-al-nm' }, h('span', { class: 'cal-dot', style: 'background:' + colorOf(S.calBy[x.calId]) }), h('span', { class: 'cal-al-name', title: name + '（' + x.count + ' 件）' }, name))),
              h('td', { class: 'num' }, NC.hours(x.simpleMin)), h('td', { class: 'num' }, NC.hours(x.realMin)), h('td', { class: 'num' }, pct(x.realMin, res.totalRealMin)), h('td', { class: 'num' }, x.allDay ? x.allDay + ' 件' : '—'));
          }), h('tr', { class: 'cal-al-total', 'data-total': String(res.totalSimpleMin) + '/' + String(Math.round(res.totalRealMin)) },
            h('td', null, '合計'), h('td', { class: 'num' }, NC.hours(res.totalSimpleMin)), h('td', { class: 'num' }, NC.hours(res.totalRealMin)), h('td', { class: 'num' }, res.totalRealMin ? '100%' : '—'), h('td', { class: 'num' }, totalAll ? totalAll + ' 件' : '—')))));
      } else {
        out.push(h('div', { class: 'cal-al-empty' }, 'この期間に、数える予定はありません。'));
      }
      out.push(h('p', { class: 'cal-al-note' }, '単位は時間。入っている時間 = 重なっても全部数える ／ 実際の時間 = 重なりは短い予定の方に数える（合計は、実際に流れた時間と同じ）。終日の予定は時間に入れず、件数だけ。辞退した予定は数えない。'));
      if (S.alloc.mine) out.push(h('p', { class: 'cal-al-note' }, '作った人が ' + (S.own.join('・') || '（自分のアドレスが未設定）') + ' の予定だけを数えています。アドレスは「設定」で足せます。'));
      if (res.over24.length) out.push(h('div', { class: 'warn cal-al-warn', 'data-over24': String(res.over24.length) }, '入っている時間が 24 時間を超えた日: ' + res.over24.map(fmtMdShort).join('、') + '（同じ時刻に重ねて入っている予定があります）'));
      var tsv = ['期間\t' + r.a + ' 〜 ' + r.b + (S.alloc.mine ? '（自分が追加した予定だけ）' : ''), 'カレンダー\t入っている時間\t実際の時間\t割合\t終日の件数']
        .concat(res.rows.map(function (x) { return [nameOf(x.calId), NC.hours(x.simpleMin), NC.hours(x.realMin), pct(x.realMin, res.totalRealMin), x.allDay].join('\t'); }))
        .concat(['合計\t' + NC.hours(res.totalSimpleMin) + '\t' + NC.hours(res.totalRealMin) + '\t' + (res.totalRealMin ? '100%' : '—') + '\t' + totalAll]).join('\n');
      out.push(h('div', { class: 'cal-al-actions' }, h('button', { type: 'button', class: 'btn small', 'data-act': 'alloc-copy', onclick: function () {
        UI.copy(tsv).then(function () { UI.toast('表をコピーしました'); }, function () { UI.toast('コピーできませんでした', true); });
      } }, '表をコピー')));
      return out;
    }

    // ================= 起動と片付け =================
    function init() {
      api('cal.init').then(function (d) {
        if (!S.alive) return;
        applyInit(d); S.ready = true;
        draw(); ensureView();
      }, function (e) { if (!S.alive) return; S.fatal = (e && e.message) || '読み込めませんでした'; draw(); });
    }
    function onResize() {
      clearTimeout(S.resizeTimer);
      S.resizeTimer = setTimeout(function () {
        if (!S.alive) return;
        var narrow = window.innerWidth < NARROW;
        if (narrow !== S.narrow) { S.narrow = narrow; S.drawer = false; S.side = !narrow; if (narrow) S.alloc.open = false; }
        draw();
      }, 120);
    }
    function onVisible() { if (document.visibilityState === 'visible' && Date.now() - S.lastLoad > STALE_MS) softRefresh(); }
    function tick() {
      if (!S.alive) return;
      var t = today();
      if (t !== S.today) { S.today = t; draw(); return; }
      if (S.view !== 'month' && !D && !S.pop && !S.dialog) drawMain();   // 赤い線を今の時刻へ
    }
    function destroy() {
      flushUndo();                 // 「元に戻す」を待っている削除は、この画面を離れる時に確定させる
      S.alive = false; keep();
      closePop(); closeDialog(); hideSnack(); cancelDrag();
      clearInterval(S.timer); clearTimeout(S.resizeTimer);
      window.removeEventListener('pagehide', flushUndo);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onVisible);
      document.removeEventListener('pointerdown', onDocDown, true);
      document.removeEventListener('pointerup', onDocUp, true);
      document.removeEventListener('keydown', onKey);
      root.remove();
    }

    S.timer = setInterval(tick, 60000);
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', flushUndo);
    document.addEventListener('visibilitychange', onVisible);
    draw();
    init();
    return { destroy: destroy };
  }

  return { mount: mount };
})();

<script>
// ---- web/js/admin.js ----
// 管理画面（自分だけが使う側）
(function () {
  var h = UI.h;
  var BOOT = window.__BOOT__ || { params: UI.parseQuery(location.search) };
  var URL_KEY = String((BOOT.params && BOOT.params.admin) || '');
  var KEY_FROM_URL = false;
  // 管理用の合言葉。URL に本物の合言葉（16 文字以上。アドレスバーから消した後の印 "1" ではない）があればそれ、
  // 無ければブラウザが覚えているもの。モックは今までどおり（覚えた合言葉があれば、作り直した後でも開ける）
  var KEY = (function () {
    var saved = UI.keyStore.get();
    if (Backend.mode === 'web') return saved;                 // 自前のページは「Google でログイン」が本筋。合言葉は覚えていれば使う
    if (Backend.mode !== 'gas') return saved || 'mock';
    if (URL_KEY.length >= 16) { KEY_FROM_URL = true; return URL_KEY; }
    return saved || URL_KEY;
  })();
  var root = document.getElementById('app');
  var D = null, V = { name: 'calendar', arg: null }, calView = null;
  var NAV_CAL = [['list', '日程調整カレンダー', '日程調整'], ['bookings', '予約一覧'], ['settings', '設定']];

  // 合言葉が通ったら、ブラウザに覚えさせて、アドレスバーから消す（画面の共有や写しから漏れないように）。
  // 覚えられないブラウザでは、今までどおり URL の合言葉で動き続ける（消さない）
  function keepKey(fromRotate) {
    if (Backend.mode !== 'gas' || (!KEY_FROM_URL && !fromRotate)) return;
    var saved = UI.keyStore.set(KEY);
    if (!saved && !fromRotate) return;
    try {
      if (window.google && google.script && google.script.history) google.script.history.replace(null, { admin: saved ? '1' : KEY }, '');
    } catch (e) { /* 消せなくても動く */ }
  }
  var LOC = { meet: 'Google Meet', inperson: '対面', phone: '電話', custom: 'その他', none: '指定なし' };
  var ROLE = { writer: '編集できる', reader: '見るだけ', freeBusyReader: '空き時間だけ見える' };
  var DURS = [15, 20, 30, 45, 60, 75, 90, 120, 150, 180];
  var STEPS = [5, 10, 15, 20, 30, 45, 60, 90, 120];
  var TIMES = [];
  for (var m = 0; m <= 1440; m += 15) TIMES.push(NC.minToHm(m));

  function api(action, payload) {
    payload = payload || {}; payload.key = KEY;
    return Backend.call(action, payload).catch(function (e) {
      // 自前のページで、ログインの印・証が通らなくなった時は、ログインの画面に戻す（開く時の断りは start が言葉を選ぶ）
      if (Backend.mode === 'web' && e && e.code === 'forbidden' && Login.has() && action !== 'admin.init') Login.expire(Login.deniedMsg());
      throw e;
    });
  }

  // 自前のページの「Google でログイン」。ログインできたら、この端末に 30 日のログインの印（session）を覚える
  // （Yu 2026-10-27「ログイン情報の維持はできる？」。使うたびに延びる。タスクのページと共通の localStorage 'nc:session'）。
  // 印をもらえない時（古い窓口）は、今まで通り証（ID トークン）をこのタブを閉じるまで覚え、切れる 5 分前に静かに取り直す
  var Login = (function () {
    var SKEY = 'nc:idToken', LKEY = 'nc:session', timer = null, onReady = null, gisLoading = null;
    function decode(t) {
      try { var p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4))))); } catch (e) { return null; }
    }
    function save(t) {
      var c = decode(t);
      if (!c || !c.exp) return false;
      Backend.idToken = t;
      try { sessionStorage.setItem(SKEY, JSON.stringify({ t: t, exp: c.exp })); } catch (e) { /* 覚えられなくても、今は使える */ }
      clearTimeout(timer);
      timer = setTimeout(function () { gis().then(function (g) { g.accounts.id.prompt(); }, function () {}); }, Math.min(3600000, Math.max(60000, c.exp * 1000 - Date.now() - 5 * 60000)));   // 長くても 1 時間ごと（setTimeout は 24.8 日を超えるとすぐ走る）
      return true;
    }
    function keep(s) {
      Backend.session = s; Backend.idToken = ''; clearTimeout(timer);
      try { localStorage.setItem(LKEY, JSON.stringify({ s: s, at: Date.now() })); } catch (e) { /* 覚えられなくても、このタブでは使える */ }
    }
    // 証で窓口に「この端末を覚えて」と頼む。古い窓口で断られたら、証だけで続ける
    function remember() {
      return Backend.call('auth.remember', {}).then(function (r) { if (r && typeof r.session === 'string' && r.session.length >= 40) keep(r.session); }, function () { /* 証だけで続ける */ });
    }
    function restore() {
      try {
        var y = JSON.parse(localStorage.getItem(LKEY) || 'null');
        if (y && typeof y.s === 'string' && y.s.length >= 40) { Backend.session = y.s; return true; }
      } catch (e) { /* 読めなければ、ログインし直す */ }
      try {
        var x = JSON.parse(sessionStorage.getItem(SKEY) || 'null');
        if (x && x.t && x.exp * 1000 > Date.now() + 60000) return save(x.t);
      } catch (e) { /* 読めなければ、ログインし直す */ }
      return false;
    }
    function clear() {
      Backend.idToken = ''; Backend.session = ''; clearTimeout(timer);
      try { sessionStorage.removeItem(SKEY); } catch (e) { /* 消せなくても困らない */ }
      try { localStorage.removeItem(LKEY); } catch (e) { /* 消せなくても困らない */ }
    }
    function gis() {
      if (gisLoading) return gisLoading;
      gisLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
        s.onload = function () {
          if (!window.google || !google.accounts || !google.accounts.id) { reject(new Error('gis')); return; }
          google.accounts.id.initialize({
            client_id: (window.NC_WEB && NC_WEB.clientId) || '', auto_select: true, cancel_on_tap_outside: false,
            callback: function (resp) { if (resp && resp.credential && save(resp.credential)) remember().then(function () { if (onReady) onReady(); }); }
          });
          resolve(google);
        };
        s.onerror = function () { gisLoading = null; reject(new Error('gis')); };
        document.head.appendChild(s);
      });
      return gisLoading;
    }
    // ログインの画面。押してログインできたら ready() を呼ぶ
    function screen(msg, ready) {
      onReady = function () { onReady = null; ready(); };
      var btn = h('div', { class: 'login-btn', 'data-login': 'google' });
      root.innerHTML = '';
      root.appendChild(h('div', { class: 'g-wrap' }, h('div', { class: 'g-error', 'data-error': 'login' },
        h('div', { class: 'a-brand', style: 'justify-content:center;margin:0 0 10px' }, UI.icon('cal'), 'カレンダー'),
        h('h2', null, 'Google でログインしてください'),
        h('p', { class: 'muted' }, msg || '持ち主のアカウント（このカレンダーを作った Google アカウント）でログインすると開きます。'),
        btn)));
      gis().then(function (g) {
        g.accounts.id.renderButton(btn, { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ja' });
        g.accounts.id.prompt();
      }, function () { btn.appendChild(h('p', { class: 'alert' }, 'Google のログインを読み込めませんでした。通信を確かめて、開き直してください。')); });
    }
    var start = null;
    return {
      has: function () { return !!(Backend.idToken || Backend.session); },
      remembered: function () { return !!Backend.session; },
      // 断られた時の言葉: 印で断られた = 期限切れか、ほかの端末で消された。証で断られた = 持ち主ではないアカウント
      deniedMsg: function () { return Backend.session ? 'ログインの期限が切れました。もう一度ログインしてください。' : Backend.idToken ? 'このアカウントでは開けません。持ち主のアカウントでログインしてください。' : ''; },
      restore: restore,
      screen: screen,
      setStart: function (fn) { start = fn; },
      expire: function (msg) { clear(); if (start) screen(msg, start); },
      // ログアウト: この端末の印を窓口からも消し、Google の自動ログインも止める（止めないと、ログインの画面ですぐまた入ってしまう）
      logout: function () {
        var s = Backend.session;
        clear();
        if (s) Backend.call('auth.forget', { forget: s }).then(function () {}, function () {});
        gis().then(function (g) { g.accounts.id.disableAutoSelect(); }, function () {}).then(function () { if (start) screen('ログアウトしました。この端末のログインも消しました。', start); });
      }
    };
  })();
  function oops(e) { UI.toast((e && e.message) || 'うまく処理できませんでした', true); }
  function go(name, arg) { V = { name: name, arg: arg }; render(); window.scrollTo(0, 0); }
  function reload() { return api('admin.init').then(function (d) { D = d; return d; }); }
  function scOf(id) { return D.scs.filter(function (s) { return s.id === id; })[0] || null; }
  function calOf(id) { return D.calendars.filter(function (c) { return c.id === id; })[0] || null; }
  function calName(id) { var c = calOf(id); return c ? c.name : '（見つからないカレンダー）'; }
  function writable() { return D.calendars.filter(function (c) { return !c.holiday && (c.role === 'owner' || c.role === 'writer'); }); }
  function tz() { return D.settings.tz; }
  function range(s, e) { return NC.fmtRange(s, e, tz(), 'ja'); }

  function loading() { return h('div', { class: 'empty' }, h('div', { class: 'spinner', style: 'margin:0 auto 10px' }), '読み込んでいます…'); }
  function urlBox(u) { return h('input', { type: 'text', class: 'url', readonly: true, value: u, onfocus: function (e) { e.target.select(); } }); }
  function thead(cols) { return h('thead', null, h('tr', null, cols.map(function (x) { return h('th', null, x); }))); }

  // 押し間違えると困るボタン。1 回目で色が変わり、もう 1 回押すと実行する
  function confirmBtn(label, sure, fn, cls) {

    b.addEventListener('click', function () {

    return b;
  }

  // ================= 一覧 =================
  function viewList() {
    var box = h('div', null, h('div', { class: 'a-head' }, h('h1', null, '日程調整カレンダー'),
      h('button', { type: 'button', class: 'btn primary', 'data-act': 'new', onclick: function () { go('edit', null); } }, '＋ 新しく作る')));
    if (!D.mock && (!D.baseUrl || /\/dev$/.test(D.baseUrl))) {
      box.appendChild(h('div', { class: 'alert' }, '相手に送る URL が、自分にしか開けないテスト用（…/dev）になっています。このままだと相手は開けません。設定の「相手に送る URL の頭」に、公開した URL（…/exec）を入れてください。',
        h('button', { type: 'button', class: 'btn small', style: 'margin-left:8px', onclick: function () { go('settings'); } }, '設定を開く')));
    }
    if (!D.settings.hostName) {
      box.appendChild(h('div', { class: 'warn', style: 'margin:0 0 14px' }, '相手の画面に出す名前がまだ入っていません。',
        h('button', { type: 'button', class: 'btn small', style: 'margin-left:8px', onclick: function () { go('settings'); } }, '設定を開く')));
    }
    if (!D.scs.length) box.appendChild(h('div', { class: 'card empty' }, 'まだありません。「新しく作る」から始めてください。'));
    D.scs.forEach(function (sc) {
      var ids = sc.busyCalendarIds.indexOf(sc.targetCalendarId) < 0 ? sc.busyCalendarIds.concat([sc.targetCalendarId]) : sc.busyCalendarIds;
      var missing = ids.filter(function (id) { return !calOf(id); });

        h('div', { class: 'sc-top' },

            confirmBtn('削除', '本当に削除', function () { api('admin.deleteSc', { id: sc.id }).then(reload).then(function () { UI.toast('削除しました'); render(); }, oops); }, 'small danger-ghost'))),
        h('div', { class: 'sc-meta' }, sc.duration + '分 ・ ' + LOC[sc.location.type] + ' ・ 空きを確かめるカレンダー ' + ids.length + ' 枚 → 予定は「' + calName(sc.targetCalendarId) + '」に入る'),

        h('div', { class: 'sc-links' },

          h('button', { type: 'button', class: 'btn', 'data-act': 'pick', onclick: function () { go('pick', sc.id); } }, '候補を選んで送る'),
          h('button', { type: 'button', class: 'btn ghost', 'data-act': 'links', onclick: function () { go('links', sc.id); } }, '発行した URL を見る'))));
    });
    return box;

        row('相手を予定に招く', check(d, 'inviteGuest', '相手のメールアドレスを、予定のゲストに入れる'), '入れると、相手のカレンダーにも予定が届き、Google Meet にそのまま入れます。'));
    }

    function secHours() {

      function redraw() { draw(); preview(); }
      var days = [1, 2, 3, 4, 5, 6, 0].map(function (dow) {

    function save() {
      var bad = '';
      function checkRanges(list, label) {
        (list || []).forEach(function (r) { if (!bad && NC.hmToMin(r[1]) <= NC.hmToMin(r[0])) bad = label + 'の受付時間で、終わりが始まりより前になっています。'; });

            })())),
          h('div', { class: 'inline' },
            h('button', { type: 'button', class: 'btn primary', 'data-act': 'make', disabled: !list.length, onclick: function () {
              api('admin.createLink', { scId: scId, candidates: list, memo: s.memo }).then(function (ln) { s.made = ln; s.err = ''; draw(); window.scrollTo(0, 0); }, oops);
            } }, 'この候補で URL を発行'),
            h('button', { type: 'button', class: 'btn', disabled: !list.length, onclick: function () { copy(lines(), '候補の日時をコピーしました'); } }, '日時だけコピー')))
      ]);
    }
    api('admin.previewSlots', { sc: { id: scId } }).then(function (r) { s.slots = r.slots; draw(); }, function (e) { s.slots = []; s.err = (e && e.message) || '読み込めませんでした'; draw(); });
    draw();
    return box;
  }

  // ================= 予約一覧 =================
  function viewBookings() {
    var box = h('div', null, h('div', { class: 'a-head' }, h('h1', null, '予約一覧')), loading());
    function badge(b, now) {
      if (b.status === 'confirmed') return b.end > now ? h('span', { class: 'badge ok' }, '確定') : h('span', { class: 'badge off' }, '終了');
      var by = { guest: '相手がキャンセル', host: '自分が取り消し', host_calendar: 'カレンダーで削除' }[b.canceledBy] || 'キャンセル';
      return h('span', { class: 'badge bad' }, by);
    }
    function table(list, now, live) {
      return h('div', { class: 'tscroll' }, h('table', { class: 'list' },
        thead(['日時', '内容', 'お相手', '場所', '状態', '']),
        h('tbody', null, list.map(function (b) {
          return h('tr', { 'data-booking': b.id },
            h('td', null, range(b.start, b.end)),
            h('td', null, b.scName, h('br'), h('small', { class: 'muted' }, '→ ' + calName(b.calendarId))),
            h('td', null, b.guest.name + (b.guest.company ? '（' + b.guest.company + '）' : ''), h('br'), h('small', { class: 'muted' }, b.guest.email),
              b.guest.note ? h('div', { class: 'hint' }, b.guest.note) : null,
              b.cancelReason ? h('div', { class: 'hint' }, '理由: ' + b.cancelReason) : null),
            h('td', null, b.meetUrl ? h('a', { href: b.meetUrl, target: '_blank', rel: 'noopener' }, 'Google Meet') : LOC[b.location.type],
              b.meetFailed ? h('div', { class: 'warn' }, 'Meet を発行できませんでした') : null),
            h('td', null, badge(b, now), b.mailError ? h('div', { class: 'warn' }, 'メールを送れませんでした') : null),
            h('td', null, live ? confirmBtn('取り消す', '本当に取り消す', function () {
              api('admin.cancelBooking', { id: b.id }).then(function (r) {
                if (r && r.mailSent === false) UI.toast('取り消しました。相手へのメールは送れなかったので、別の方法で知らせてください', true);
                else UI.toast('取り消して、相手に知らせました');
                load();
              }, function (e) { oops(e); load(); });
            }, 'small danger-ghost') : null));
        }))));
    }
    function load() {
      api('admin.bookings').then(function (r) {
        var up = [], past = [];
        r.bookings.forEach(function (b) { (b.status === 'confirmed' && b.end > r.now ? up : past).push(b); });
        past.reverse();
        box.innerHTML = '';
        UI.append(box, [
          h('div', { class: 'a-head' }, h('h1', null, '予約一覧'), h('button', { type: 'button', class: 'btn', onclick: load }, '読み直す')),
          h('section', { class: 'card' }, h('h2', { style: 'font-size:16px;margin:0 0 8px' }, 'これからの予定（' + up.length + ' 件）'),
            up.length ? table(up, r.now, true) : h('div', { class: 'empty' }, 'これからの予定はありません。')),
          past.length ? h('section', { class: 'card' }, h('h2', { style: 'font-size:16px;margin:0 0 8px' }, '終わった予定・キャンセル'), table(past.slice(0, 50), r.now, false)) : null
        ]);
      }, function (e) { box.innerHTML = ''; box.appendChild(h('div', { class: 'alert' }, (e && e.message) || '読み込めませんでした')); });
    }
    load();
    return box;
  }

  // ================= 設定 =================
  var rotated = null;   // 合言葉を作り直した直後の、新しい URL（画面を描き直しても見せ続ける）
  function viewSettings() {
    var s = JSON.parse(JSON.stringify(D.settings));
    if (Array.isArray(s.ownEmails)) s.ownEmails = s.ownEmails.join(', ');
    s.writeShared = Array.isArray(s.writeShared) ? s.writeShared.slice() : [];
    function inp(key, ph) {
      var el = h('input', { type: 'text', placeholder: ph || null, 'data-f': key, oninput: function (e) { s[key] = e.target.value; } });
      el.value = s[key] || '';
      return el;
    }
    function row(label, control, hint) {
      return h('div', { class: 'row' }, h('div', { class: 'row-label' }, label), h('div', { class: 'row-body' }, control, hint ? h('div', { class: 'hint' }, hint) : null));
    }
    // 人から共有されていて、書き込みの権限があるカレンダー（役割が writer）
    var writers = D.calendars.filter(function (c) { return !c.holiday && c.role === 'writer'; });
    function save() {
      api('admin.saveSettings', { settings: s }).then(reload).then(function () { UI.toast('保存しました'); render(); }, oops);
    }
    function rotate() {
      api('admin.rotateKey', { keep: Backend.session || '' }).then(function (r) {
        KEY = r.adminKey;
        keepKey(true);
        rotated = r.adminUrl || ('（公開した URL）?admin=' + r.adminKey);
        UI.toast('合言葉を作り直しました。古い URL は、もう使えません。');
        render();
      }, function (e) { oops(e); render(); });
    }
    return h('div', null,
      h('div', { class: 'a-head' }, h('h1', null, '設定')),
      h('section', { class: 'card sec' }, h('h2', null, '自分のこと'),
        row('相手に見せる名前', inp('hostName', '例: 香西 優'), '相手の画面とメールに出ます。'),
        row('返信先のメールアドレス', inp('replyTo', D.owner.email), '空なら ' + D.owner.email + ' を使います。予約の知らせもここに届きます。'),
        row('タイムゾーン', inp('tz', 'Asia/Tokyo'), '受付時間は、このタイムゾーンで数えます。'),
        row('相手に送る URL の頭', inp('baseUrl', D.baseUrl), '空なら自動で決まります。自分のドメインから転送する時だけ入れます。'),
        h('div', { class: 'inline', style: 'padding-top:12px' }, h('button', { type: 'button', class: 'btn primary', 'data-act': 'save', onclick: save }, '保存する'))),
      h('section', { class: 'card sec' }, h('h2', null, 'カレンダー画面'),
        row('自分のアドレス', inp('ownEmails', '例: work@example.co.jp, me@example.jp'),
          '時間の配分の「自分が追加した予定だけ」で、自分が作った予定を見分けるのに使います。' + D.owner.email + ' は初めから入っています。仕事用の別アドレスがあれば , で区切って足してください。'),
        row('書き込みを許す共有カレンダー', writers.length ? h('div', null, writers.map(function (c) {
          return h('label', { class: 'check' }, h('input', { type: 'checkbox', 'data-ws': c.id, checked: s.writeShared.indexOf(c.id) >= 0, onchange: function (e) {
            s.writeShared = s.writeShared.filter(function (x) { return x !== c.id; });
            if (e.target.checked) s.writeShared.push(c.id);
          } }), h('span', { class: 'dot', style: 'background:' + color(c.color) }), h('span', null, c.name));
        })) : h('p', { class: 'muted', 'data-ws-none': '1' }, '書き込みの権限がある共有カレンダーはありません。'),
          '人から共有されたカレンダーは、ここでチェックを入れたものだけ、カレンダー画面から予定を足したり直したりできます（初めは、自分が持ち主のカレンダーだけ）。'),
        h('div', { class: 'inline', style: 'padding-top:12px' }, h('button', { type: 'button', class: 'btn primary', 'data-act': 'save2', onclick: save }, '保存する'))),
      h('section', { class: 'card sec', 'data-sec': 'device' }, h('h2', null, 'この端末だけの設定'),
        row('マイエージェントの URL', (function () {
          var cur = ''; try { cur = localStorage.getItem(AGENT_KEY) || ''; } catch (e) { cur = ''; }
          var el = h('input', { type: 'url', 'data-f': 'agentUrl', placeholder: (window.NC_LINKS && NC_LINKS.agent) || 'http://127.0.0.1:8179/', maxlength: 500 });
          el.value = cur;
          var btn = h('button', { type: 'button', class: 'btn', 'data-act': 'saveAgent', onclick: function () {
            var v = el.value.trim();
            if (v && !/^https?:\/\/\S+$/.test(v)) { UI.toast('http:// か https:// で始まる URL を入れてください', true); return; }
            try { if (v) localStorage.setItem(AGENT_KEY, v); else localStorage.removeItem(AGENT_KEY); } catch (e) { UI.toast('このブラウザでは覚えられませんでした', true); return; }
            UI.toast(v ? 'この端末で覚えました' : '初めの行き先に戻しました');
            render();
          } }, 'この端末で覚える');
          return h('div', { class: 'urlrow' }, el, btn);
        })(), 'メニューの「マイエージェント」で開く先です。空なら ' + ((window.NC_LINKS && NC_LINKS.agent) || 'http://127.0.0.1:8179/') +
          '（この Mac 用）。iPhone など別の端末では、その端末で合言葉（token）つきの URL を 1 回貼ってください。URL はこの端末の中だけに覚え、どこにも送りません。'),
        Backend.mode === 'web' && Login.remembered() ? row('ログイン', h('button', { type: 'button', class: 'btn', 'data-act': 'logout', onclick: function () { Login.logout(); } }, 'この端末からログアウト'),
          'Google でログインした状態を、この端末に 30 日覚えています（使うたびに延びます。タスクのページと共通）。') : null),
      h('section', { class: 'card sec' }, h('h2', null, '安全'),
        h('p', { class: 'muted' }, '管理画面の URL に入っている合言葉は、全部のカレンダーを読み書きできる鍵です。漏れたかもしれない時や、ログインしたままの端末をなくした時は、作り直してください。古い URL はその瞬間から使えなくなり、この端末以外のログインも全部消えます。'),
        rotated ? h('div', { class: 'banner', 'data-rotated': '1' }, h('b', null, '新しい管理画面の URL（控えてください。古い URL は、もう使えません）'),
          h('div', { class: 'urlrow', style: 'margin-top:8px' }, urlBox(rotated), h('button', { type: 'button', class: 'btn', onclick: function () { copy(rotated, 'URL をコピーしました'); } }, 'コピー'))) : null,
        h('div', { class: 'inline', style: 'padding-top:8px' }, (function () { var b = confirmBtn('合言葉を作り直す', '本当に作り直す（古い URL と、ほかの端末のログインが使えなくなります）', rotate, 'danger-ghost'); b.setAttribute('data-act', 'rotate'); return b; })())),
      D.mock ? h('section', { class: 'card sec' }, h('h2', null, 'モック'),
        h('p', { class: 'muted' }, 'モックで作ったデータ（日程調整カレンダー・予約・メール）は、このブラウザの中だけにあります。'),
        confirmBtn('モックのデータを最初に戻す', '本当に戻す', function () { Backend.reset(); reload().then(function () { UI.toast('最初の見本に戻しました'); go('list'); }, oops); }, '')) : null);
  }

  // ================= 送ったメール（モックだけ）=================
  function viewMails() {
    var box = h('div', null, h('div', { class: 'a-head' }, h('h1', null, '送信メール（モック）')), loading());
    api('admin.mockMails').then(function (r) {
      var list = r.mails.slice().reverse();
      box.innerHTML = '';
      UI.append(box, [
        h('div', { class: 'a-head' }, h('h1', null, '送信メール（モック）')),
        h('p', { class: 'muted', style: 'margin:0 0 14px' }, '本番ならここに並ぶ内容が、実際にメールで送られます。'),
        list.length ? list.map(function (ml) {
          return h('section', { class: 'card', 'data-mail': ml.to },
            h('div', { class: 'mail-head' }, h('b', null, ml.subject), h('small', { class: 'muted' }, '宛先: ' + ml.to + ' ／ ' + stamp(ml.at))),
            h('div', { class: 'mail' }, ml.text));
        }) : h('div', { class: 'card empty' }, 'まだ 1 通も送っていません。相手の画面から予約すると、ここに出ます。')
      ]);
    }, oops);
    return box;
  }

  // メニューの、ほかのページへのリンク。行き先は組み立ての時に入る（NC_LINKS）。
  // マイエージェントは端末ごとに行き先が違う（この Mac は 127.0.0.1、iPhone は合言葉つきの URL）ので、この端末で覚えた URL があればそちらへ
  var AGENT_KEY = 'nc:agentUrl';
  function agentUrl() {
    var v = ''; try { v = localStorage.getItem(AGENT_KEY) || ''; } catch (e) { v = ''; }
    return /^https?:\/\/\S+$/.test(v) ? v : ((window.NC_LINKS && NC_LINKS.agent) || '');
  }
  function extLinks() {
    var L = window.NC_LINKS || {}, out = [];
    if (L.tasks) out.push(['tasks', 'タスク管理', 'タスク管理', { href: L.tasks }]);
    var a = agentUrl();
    if (a) out.push(['agent', 'マイエージェント', 'マイエージェント', { href: a }]);
    return out;
  }

  function render() {
    var views = { list: viewList, edit: viewEdit, links: viewLinks, pick: viewPick, bookings: viewBookings, settings: viewSettings, mails: viewMails };
    var nav = [['calendar', 'カレンダー'], ['list', '日程調整カレンダー'], ['bookings', '予約一覧'], ['settings', '設定']];
    var calNav = NAV_CAL.slice();
    if (D.mock) { nav.push(['mails', '送信メール（モック）']); calNav.push(['mails', '送信メール（モック）', '送信メール']); }
    nav = nav.concat(extLinks()); calNav = calNav.concat(extLinks());
    var active = { edit: 'list', links: 'list', pick: 'list' }[V.name] || V.name;
    if (calView) { calView.destroy(); calView = null; }
    root.innerHTML = '';
    if (V.name === 'calendar') {
      // カレンダーは画面いっぱいに使う（左の列・上の帯は、カレンダー画面が自分で持つ）
      var box = h('div', { class: 'a-cal', 'data-view': 'calendar' });
      root.appendChild(box);
      calView = CalendarView.mount(box, { api: api, go: go, nav: calNav, mock: !!D.mock });
      return;
    }
    root.appendChild(h('div', { class: 'a-shell', 'data-view': V.name },
      h('aside', { class: 'a-nav' },
        h('div', { class: 'a-brand' }, UI.icon('cal'), '日程調整'),
        nav.map(function (n) {
          if (n[3] && n[3].href) return h('a', { class: 'a-navitem', 'data-nav': n[0], href: n[3].href, target: '_top', rel: 'noopener' }, n[1]);
          return h('button', { type: 'button', class: 'a-navitem' + (active === n[0] ? ' is-on' : ''), 'data-nav': n[0], onclick: function () { go(n[0]); } }, n[1]);
        }),
        D.mock ? h('div', { class: 'a-mock' }, 'モック表示中', h('small', null, 'カレンダー・メール・Meet はすべて作りものです')) : null),
      h('main', { class: 'a-main' }, views[V.name](V.arg))));
  }

  function start() {
    root.innerHTML = '';
    root.appendChild(loading());
    reload().then(function () { keepKey(false); render(); }, function (e) {
      var noKey = !!(e && e.code === 'forbidden');
      // 自前のページ: ログインしたのに断られた＝持ち主ではないアカウント。ログインの画面に戻す
      if (Backend.mode === 'web' && noKey) { Login.expire(Login.deniedMsg()); return; }
      root.innerHTML = '';
      root.appendChild(h('div', { class: 'g-wrap' }, h('div', { class: 'g-error', 'data-error': noKey ? 'key' : 'init' },
        h('h2', null, noKey ? '合言葉の入った URL で開いてください' : '管理画面を開けませんでした'),
        h('p', { class: 'muted' }, noKey ? '管理用の合言葉が見つからないか、古くなっています。合言葉の入った管理画面の URL（…?admin=…）で開き直してください。' : ((e && e.message) || '')))));
    });
  }
  Login.setStart(start);
  document.title = 'カレンダー｜ワークスペース';
  // 自前のページでは、まず「Google でログイン」（覚えている証があればそのまま）。合言葉を覚えているブラウザは、それでも開ける
  if (Backend.mode === 'web' && !Login.restore() && !KEY) Login.screen('', start);
  else start();
})();

</script>
</body>
</html>
