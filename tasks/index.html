<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>タスク</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%231a73e8'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root {
  --bg: #ffffff; --bg2: #f8f9fa; --card: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --faint: #80868b; --line: #dadce0; --line2: #ebedf0;
  --accent: #1a73e8; --accent-bg: #e8f0fe; --bad: #d93025; --bad-bg: #fce8e6; --warn: #b06000; --warn-bg: #fef7e0; --ok: #188038; --ok-bg: #e6f4ea;
  --shadow: 0 1px 2px rgba(60, 64, 67, .3), 0 2px 6px 2px rgba(60, 64, 67, .15); --radius: 10px; --on-accent: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1f; --bg2: #2a2a2a; --card: #262626; --fg: #e8eaed; --muted: #bdc1c6; --faint: #9aa0a6; --line: #3c4043; --line2: #333;
    --accent: #8ab4f8; --accent-bg: #283a55; --bad: #f28b82; --bad-bg: #4a2723; --warn: #fdd663; --warn-bg: #4a3f1e; --ok: #81c995; --ok-bg: #1f3a28;
    --shadow: 0 1px 3px rgba(0, 0, 0, .6); --on-accent: #202124; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --bg2: #2a2a2a; --card: #262626; --fg: #e8eaed; --muted: #bdc1c6; --faint: #9aa0a6; --line: #3c4043; --line2: #333;
  --accent: #8ab4f8; --accent-bg: #283a55; --bad: #f28b82; --bad-bg: #4a2723; --warn: #fdd663; --warn-bg: #4a3f1e; --ok: #81c995; --ok-bg: #1f3a28;
  --shadow: 0 1px 3px rgba(0, 0, 0, .6); --on-accent: #202124; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 "Google Sans", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 500; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.nav { display: flex; gap: 4px; margin-left: 6px; }
.nav a { padding: 6px 10px; border-radius: 18px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.nav a:hover { background: var(--bg2); }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.05); }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 13px; }
.icon-btn { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--bg2); }
.icon-btn svg { width: 20px; height: 20px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; }
.notice { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; background: var(--card); }
.notice.warn { border-color: var(--warn); background: var(--warn-bg); }
.notice.bad { border-color: var(--bad); background: var(--bad-bg); }
.notice h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
.notice p { margin: 0 0 8px; color: var(--muted); }
.notice p:last-child { margin-bottom: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 18px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.tab .n { margin-left: 4px; font-size: 12px; opacity: .8; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); border-radius: 16px; padding: 4px 10px; background: var(--card); cursor: pointer; font-size: 13px; color: var(--muted); }
.fchip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.meta { color: var(--faint); font-size: 12px; margin: -4px 0 10px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--bg2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--bg2); }
tr.row.sel td { background: var(--accent-bg); }
tr.row.done .ttl { color: var(--faint); text-decoration: line-through; }
.ttl { display: block; overflow-wrap: anywhere; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; font-size: 12px; color: var(--faint); }
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--bg2); color: var(--muted); white-space: nowrap; }
.chip.mine { background: var(--accent-bg); color: var(--accent); }
.chip.team { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.due { white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.over { color: var(--bad); font-weight: 500; }
.due.raw { color: var(--faint); }
select.st { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--card); max-width: 100%; }
.empty { padding: 28px 16px; text-align: center; color: var(--faint); }
/* タスクの中身・足す・期限を順に決める: 真ん中のポップアップ（スマホは下から出す）。後ろは暗くして、押すと閉じる */
.pop { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; overscroll-behavior: contain;
  border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px 16px 0; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); }
.pop > :last-child { margin-bottom: 16px; }
.pop h4 { margin: 2px 0 10px; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .32); z-index: 19; }
body.modal { overflow: hidden; }
form.add label.tname input { font-size: 17px; font-weight: 500; padding: 9px 10px; }
/* 「直す」は下に付いたまま（タスク名や詳細を直して、下まで行かなくても押せる） */
form.add .acts.save { position: sticky; bottom: 0; z-index: 1; background: var(--card); margin: 4px -16px 0; padding: 10px 16px; border-top: 1px solid var(--line2); }
/* 星: 付いた物は黄色。付いていない物は、マウスを載せた時だけ見せる（触る画面ではいつも薄く出す） */
.tcell { display: flex; align-items: flex-start; gap: 6px; }
.tmain { flex: 1; min-width: 0; }
.star { flex: none; width: 28px; height: 28px; margin: -3px 0 -3px -4px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.star svg { width: 20px; height: 20px; }
.star svg path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.star:hover { background: var(--bg2); }
.star.on { color: #f4b400; }
.star.on svg path { fill: currentColor; }
.dh .star { width: 36px; height: 36px; margin: 0; }
.dh .star svg { width: 22px; height: 22px; }
@media (hover: hover) { tr.row:not(:hover) .star:not(.on) { opacity: 0; } }
@media (hover: none) { tr.row .star:not(.on) { opacity: .45; } }
/* 色を選ぶ丸 */
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--c, transparent); cursor: pointer; padding: 0; flex: none; }
.sw.none { background: linear-gradient(135deg, transparent 46%, var(--faint) 46%, var(--faint) 54%, transparent 54%); }
.sw.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.sw:disabled { opacity: .55; cursor: default; }
.dh { display: flex; align-items: flex-start; gap: 8px; }
.dh .x { flex: 1; min-width: 0; }
.stbtns { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
dl.dl { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; margin: 0; font-size: 13px; }
dl.dl dt { color: var(--muted); }
dl.dl dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.hint { font-size: 12px; color: var(--faint); margin: -4px 0 10px; }
form.add label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
form.add input, form.add select, form.add textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
form.add .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
form.add .acts { display: flex; justify-content: flex-end; gap: 8px; }
.foot { margin-top: 16px; font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.foot button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { background: #323232; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: 100%; pointer-events: auto; }
.toast.bad { background: var(--bad); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.login { max-width: 420px; margin: 12vh auto; padding: 24px 20px; text-align: center; }
.login h2 { font-size: 20px; font-weight: 500; margin: 12px 0 6px; }
.login p { color: var(--muted); margin: 0 0 18px; }
.login .gbtn { display: flex; justify-content: center; min-height: 44px; }
.hide-n { }
@media (max-width: 640px) {
  .pop { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-height: 88vh; border-radius: 16px 16px 0 0; }
}
@media (max-width: 640px) {
  .top { padding: 8px 16px; gap: 4px; }
  .brand { font-size: 16px; }
  .nav { margin-left: 0; }
  .nav a { padding: 6px 8px; }
  .wrap { padding: 10px 16px 60px; }
  .hide-n { display: none; }
  th.st-h { width: 1%; }
  td { padding: 8px 8px; }
  select.st { font-size: 13px; padding: 3px 2px; }
}
.linkish { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; }
form.add .acts .sp { flex: 1; }
.qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; }
.qrow .ql { width: 52px; font-size: 12px; color: var(--muted); flex: none; }
.endacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: flex-start; }
.sortsel { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sortsel select { border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; background: var(--card); }
.decide h4.dname { font-size: 18px; margin: 4px 0 8px; }
tr.row[draggable="true"] { cursor: grab; }
tr.row.dragging td { opacity: .4; }
tr.row.drop-a td { box-shadow: inset 0 2px 0 var(--accent); }
tr.row.drop-b td { box-shadow: inset 0 -2px 0 var(--accent); }
.chip.show-n { display: none; }
@media (max-width: 640px) { .chip.show-n { display: inline-flex; } }
/* 番号（順番）の列: 押すと数を入れられる。見出しは押すと並べ替え */
th.no-h, td.no { width: 1%; white-space: nowrap; text-align: center; }
th.st-h { width: 1%; white-space: nowrap; }
td.no { padding-left: 8px; padding-right: 2px; }
.nob { min-width: 30px; height: 28px; padding: 0 6px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: text; font: inherit; font-variant-numeric: tabular-nums; }
.nob:hover { border-color: var(--line); background: var(--card); color: var(--fg); }
.noin { width: 60px; height: 30px; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 8px; background: var(--card); text-align: center; font-variant-numeric: tabular-nums; }
.nodash { color: var(--faint); }
.thb { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
.thb:hover { color: var(--fg); }
.thb.on { color: var(--accent); }
.thb .ar { font-size: 9px; }
/* 絞り込みの欄 */
.fpanel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 10px 12px 2px; margin: 0 0 10px; }
.fpanel .qrow .sp { flex: 1; }
@media (max-width: 640px) { td.no { padding-left: 4px; padding-right: 0; } .nob { min-width: 26px; padding: 0 3px; } }

/* ---- v6（2026-10-27）: 案内の欄・検索・並び替え・つまみ・右端の開くボタン・カテゴリとタグ・好きな色・マスタ */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn.sm svg { width: 16px; height: 16px; }
.icon-btn:disabled { opacity: .4; cursor: default; }
/* 上の段: 検索の欄 */
.search { flex: 1; min-width: 0; max-width: 560px; display: flex; align-items: center; gap: 6px; margin: 0 6px; padding: 0 6px 0 12px; height: 40px; border-radius: 20px; background: var(--bg2); border: 1px solid transparent; }
.search:focus-within { background: var(--card); border-color: var(--line); box-shadow: var(--shadow); }
.search > svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; padding: 0; }
.search input::-webkit-search-cancel-button { display: none; }
.search .qclear { visibility: hidden; }
.search.has .qclear { visibility: visible; }
.navbtn { display: none; }
/* 骨組み: 左に案内の欄、右に一覧 */
.shell { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
.shell .wrap { max-width: none; margin: 0; min-width: 0; }
.side { position: sticky; top: 61px; max-height: calc(100vh - 61px); overflow: auto; padding: 12px 8px 40px 12px; }
.side .sec { padding: 6px 0; border-bottom: 1px solid var(--line2); }
.side .sec:last-child { border-bottom: 0; }
.side .sh { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 4px; font-size: 12px; color: var(--faint); }
.side .sh .linkish { font-size: 12px; }
.ni { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 5px 10px; border: 0; border-radius: 17px; background: transparent; color: var(--fg); cursor: pointer; text-align: left; text-decoration: none; font: inherit; }
.ni:hover { background: var(--bg2); }
.ni.on { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.ni .n { margin-left: auto; font-size: 12px; color: var(--faint); font-weight: 400; }
.ni.on .n { color: var(--accent); }
.ni .ni-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ni-ic { width: 16px; text-align: center; flex: none; }
.star-ic { color: #f4b400; }
.ni-none { padding: 4px 10px 6px; font-size: 12px; color: var(--faint); }
.side .links .ni { color: var(--accent); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, transparent); border: 1px solid var(--c, var(--line)); }
.navscrim { display: none; }
/* 一覧の上の段 */
.vtitle { font-size: 16px; font-weight: 500; white-space: nowrap; }
.vtitle .n { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--faint); }
.fchip.unf { display: inline-flex; align-items: center; gap: 4px; }
.fchip.unf .x { font-size: 14px; line-height: 1; }
.sortbox { display: inline-flex; align-items: center; gap: 4px; }
.sortsel select { font-size: 13px; }
.dirb { min-width: 0; }
.draghint { font-size: 12px; color: var(--faint); margin: -4px 0 8px; }
/* カテゴリ・タグの印 */
.chip.cat { gap: 5px; background: var(--bg2); color: var(--fg); }
.chip.tag { gap: 4px; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip .dot { width: 8px; height: 8px; }
/* 番号の欄のつまみ（押したまま動かす。指でも動くように、触った時に画面が動かない） */
.nocell { display: inline-flex; align-items: center; gap: 0; }
.grip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 30px; margin-left: -4px; color: var(--faint); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 6px; }
.grip svg { width: 16px; height: 16px; }
.grip:hover { color: var(--fg); background: var(--bg2); }
body.grabbing, body.grabbing * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
/* 右端の開くボタン（開いている時は ×） */
th.acc-h, td.acc { width: 1%; padding-left: 0; padding-right: 8px; text-align: right; }
.accb { width: 32px; height: 32px; border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.accb svg { width: 20px; height: 20px; }
.accb:hover { background: var(--bg2); border-color: var(--line); color: var(--fg); }
.accb.on { color: var(--accent); background: var(--accent-bg); }
tr.row.opened td { border-bottom-color: transparent; }
tr.more td { padding: 0 10px 12px; border-bottom: 1px solid var(--line2); background: var(--card); cursor: default; }
.more-in { margin-left: 28px; padding: 10px 12px; border-left: 3px solid var(--accent-bg); background: var(--bg2); border-radius: 0 8px 8px 0; }
.mdesc { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
.mmemo { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; color: var(--muted); }
.mmemo .ml { display: inline-block; margin-right: 8px; font-size: 12px; color: var(--faint); }
.faint { color: var(--faint); }
dl.mgrid { grid-template-columns: 72px 1fr 72px 1fr; gap: 4px 10px; }
dl.mgrid dd { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; white-space: normal; }
.macts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; }
/* 中身のカテゴリ・タグ（押すと付く・外れる） */
.mchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 16px; padding: 3px 10px; background: var(--card); cursor: pointer; font-size: 13px; color: var(--fg); }
.mchip.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.newin { display: inline-flex; align-items: center; gap: 6px; }
.newin input { width: 160px; padding: 5px 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--bg); }
.qrow .linkish { font-size: 13px; }
/* 好きな色（色を選ぶ欄を丸に見せる） */
.sw.pick { position: relative; display: inline-flex; overflow: hidden; background: conic-gradient(#ea4335, #fbbc04, #34a853, #4285f4, #a142f4, #ea4335); }
.sw.pick.set { background: var(--c); }
.sw.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
/* タグとカテゴリ（マスタ） */
.mtabs { display: flex; gap: 4px; margin: 0 0 10px; }
.mlist { display: flex; flex-direction: column; gap: 6px; }
.mrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mrow .mname { flex: 1; min-width: 120px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.mrow .mname:focus { border-color: var(--accent); outline: none; }
.mcount { font-size: 12px; color: var(--faint); min-width: 40px; text-align: right; }
.madd { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line2); }
.madd input[name=name] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.morph { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line2); display: flex; flex-direction: column; gap: 6px; }
.morph .hint { margin: 0; }
.empty.small { padding: 12px; }
@media (max-width: 900px) {
  .shell { display: block; }
  .navbtn { display: inline-flex; margin-left: -6px; }
  .side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 18; width: min(300px, 86vw); max-height: none; background: var(--card); box-shadow: var(--shadow); transform: translateX(-105%); visibility: hidden; transition: transform .18s ease, visibility 0s linear .18s; padding-top: 16px; }
  .nav-open .side { transform: none; visibility: visible; transition: transform .18s ease, visibility 0s; }   /* 閉じている時は Tab でも入らない */
  .nav-open .navscrim { display: block; position: fixed; inset: 0; z-index: 17; background: rgba(0, 0, 0, .32); }
  .search { margin: 0 2px; }
}
@media (max-width: 640px) {
  .search input { font-size: 16px; }   /* iPhone で、押した時に画面が大きくならないように */
  .search input::placeholder { font-size: 14px; }
  dl.mgrid { grid-template-columns: 72px 1fr; }
  .more-in { margin-left: 0; }
  .vtitle { width: 100%; }
  .sortbox { order: 9; }
  .newin input { width: 130px; }
}

/* 中身の欄の中の、色を選ぶ丸と「新しく作る」の欄（ほかの入力の形を受けない） */
form.add label.sw { display: inline-flex; margin: 0; }
form.add .sw.pick input { display: block; margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }
form.add .newin input { display: inline-block; width: 160px; margin: 0; padding: 5px 8px; border: 1px solid var(--accent); }
.newin .linkish { white-space: nowrap; }
.chip.due-n { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  form.add .newin input { width: 130px; }
  td.acc { padding-right: 4px; }
}

  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var OPEN = {};         // 右端のボタンで詳細を開いている行（key → true。この画面を開いている間だけ）

  var I_CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';

  var I_SEARCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function loadF() {
    var d = { v: F_VER, view: 'すべて', off: {}, co: '', cat: '', tag: '', sort: '順番', dir: 'asc', fs: { st: [], pr: [], ug: [], star: false } };

        FSETS.forEach(function (g) { if (Array.isArray(v.fs[g[0]])) d.fs[g[0]] = v.fs[g[0]].filter(function (x) { return g[2].indexOf(x) >= 0; }); });

  keepF();   // 前の版の形を、今の版の形で覚え直す（1 回だけの直しが毎回は起きないように）
  function addDays(d, n) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n)).toISOString().slice(0, 10) : d; }
  function wdOf(d) { return (new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7; }   // 月曜 = 0
  function eomOf(d) { return new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7), 0)).toISOString().slice(0, 10); }
  // 期限のボタン（「今週中」は金曜。土日なら次の金曜。表の「期限目処」の読み方と同じ決め）
  function quickDues(today) {

  function toast(msg, bad) {

  // ---- 窓口（GAS の doPost を fetch で呼ぶ。text/plain で送る: JSON の型だとブラウザが事前の問い合わせを挟み、GAS が答えられない）
  var Backend = {
    idToken: '',
    session: '',   // この端末のログインの印（30 日。使うたびに延びる。カレンダーのページと共通）
    call: function (action, payload) {

            var f = window.WsMockFail;

  // ---- 「Google でログイン」（カレンダーのページと同じ）。ログインできたら、この端末に 30 日のログインの印（session）を覚える
  //      （Yu 2026-10-27「ログイン情報の維持はできる？」。使うたびに延びる。カレンダーのページと共通の localStorage 'nc:session'）。
  //      印をもらえない時（古い窓口）は、今まで通り証（ID トークン）をこのタブの間だけ覚え、切れる 5 分前に静かに取り直す
  var Login = (function () {
    var SKEY = 'nc:idToken', LKEY = 'nc:session', timer = null, onReady = null, gisLoading = null;

      return true;
    }
    function keep(s) {
      Backend.session = s; Backend.idToken = ''; clearTimeout(timer);
      try { localStorage.setItem(LKEY, JSON.stringify({ s: s, at: Date.now() })); } catch (e) { /* 覚えられなくても、このタブでは使える */ }
    }

    }
    function restore() {
      try { var y = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (y && typeof y.s === 'string' && y.s.length >= 40) { Backend.session = y.s; return true; } } catch (e) { /* 読めなければ、ログインし直す */ }
      try { var x = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); if (x && x.t && x.exp * 1000 > Date.now() + 60000) return save(x.t); } catch (e) { /* 読めなければ、ログインし直す */ }

      return gis().then(function (g) { g.accounts.id.disableAutoSelect(); }, function () {});
    }
    function gis() {
      if (gisLoading) return gisLoading;
      gisLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
        s.onload = function () {
          if (!window.google || !google.accounts || !google.accounts.id) { reject(new Error('gis')); return; }

            client_id: WS.clientId || '', auto_select: true, cancel_on_tap_outside: false,

        '<h2>Google でログインしてください</h2><p>' + esc(msg || '持ち主のアカウント（カレンダーと同じ Google アカウント）でログインすると開きます。') + '</p><div class="gbtn" id="gbtn"></div></div>';

  function refresh() {

    placeTask(t, (after ? i + 1 : i) + 1);
  }
  function moveTask(t, dir) {
    var n = t && POS[t.key];
    if (!n) return;
    var to = dir === 'up' ? n - 1 : n + 1;
    if (to < 1 || to > POSN) { toast(dir === 'up' ? 'いちばん上です' : 'いちばん下です'); return; }
    placeTask(t, to);
  }
  // 番号の欄で数を入れ終えた時（Enter・欄の外を押した時）
  function commitNo(inp) {
    var key = inp.getAttribute('data-noin'), t = taskOf(key), n = parseInt(inp.value, 10);
    if (NOEDIT !== key) return;
    NOEDIT = null;
    if (t && n >= 1 && n !== POS[key]) placeTask(t, n); else render();
  }
  function addTask(f) {
    var p = { name: f.name.value.replace(/\s+/g, ' ').trim(), company: f.company ? f.company.value.trim() : '', due: f.due.value, priority: f.priority.value, detail: f.detail.value.trim(), origin: '画面' };
    if (f.category && f.category.value) p.category = f.category.value;
    if (f.tags && f.tags.value) p.tags = [f.tags.value];
    if (!p.name) { f.name.focus(); return; }
    var b = f.querySelector('[type=submit]');
    b.disabled = true; b.textContent = '足しています…';
    Backend.call('task.add', p).then(function (d) {
      if (d && d.task && !taskOf(d.task.key)) D.tasks.push(d.task);
      if (d && d.orders && !PEND) applyOrders(d.orders);
      SEL = null; render(); toast('「' + short(p.name) + '」を足しました');
    }, function (e) {
      b.disabled = false; b.textContent = '足す';
      if (e && e.code === 'forbidden' && !WS.mock) { relogin('ログインの期限が切れました。もう一度ログインしてください。'); return; }
      toast((e && e.message) || '足せませんでした', true);
    });
  }
  function setup(btn) {
    if (btn) { btn.disabled = true; btn.textContent = '作っています…'; }
    Backend.call('task.setup').then(function (d) { toast(d.created ? '「Yu のタスク」の表を作りました' : '表はもうあります'); refresh(); }, function (e) {
      if (btn) { btn.disabled = false; btn.textContent = '表を作る'; }
      toast((e && e.message) || '表を作れませんでした', true);
    });
  }

  function closeNav() { if (NAV) { NAV = false; } }
  function unf(k) {
    if (k === 'co') F.co = ''; else if (k === 'cat') F.cat = ''; else if (k === 'tag') F.tag = ''; else if (k === 'star') F.fs.star = false;
    else if (k === 'q') { Q = ''; var qi = root.querySelector('input[data-q]'); if (qi) qi.value = ''; }
    else if (/^fs:/.test(k)) { var a = k.split(':'), l = F.fs[a[1]], i = l ? l.indexOf(a.slice(2).join(':')) : -1; if (i >= 0) l.splice(i, 1); }
    keepF();
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, a, tr.row, .scrim, .navscrim');
    if (!el || !root.contains(el)) return;
    if (el.matches('[data-reload]')) return refresh();
    if (el.matches('[data-nav]')) { NAV = !NAV; render(); return; }
    if (el.matches('[data-qclear]')) { Q = ''; var qi = root.querySelector('input[data-q]'); if (qi) { qi.value = ''; qi.focus(); } render(); return; }
    if (el.matches('[data-new]')) { SEL = '__new__'; ARM = ''; MK = ''; closeNav(); render(); var i = document.querySelector('#addForm input[name=name]'); if (i) i.focus(); return; }
    if (el.matches('[data-close]')) { SEL = null; ARM = ''; MK = ''; render(); return; }
    if (el.matches('[data-view]')) { F.view = el.getAttribute('data-view'); keepF(); closeNav(); render(); return; }
    if (el.matches('[data-src]')) { var k = el.getAttribute('data-src'); if (F.off[k]) delete F.off[k]; else F.off[k] = true; keepF(); render(); return; }
    if (el.matches('[data-co]')) { var c = el.getAttribute('data-co'); F.co = F.co === c ? '' : c; keepF(); closeNav(); render(); return; }
    if (el.matches('[data-cat]')) { var cv0 = el.getAttribute('data-cat'); F.cat = F.cat === cv0 ? '' : cv0; keepF(); closeNav(); render(); return; }
    if (el.matches('[data-tag]')) { var tv0 = el.getAttribute('data-tag'); F.tag = F.tag === tv0 ? '' : tv0; keepF(); closeNav(); render(); return; }
    if (el.matches('[data-unf]')) { unf(el.getAttribute('data-unf')); render(); return; }
    if (el.matches('[data-unfall]')) { F.co = ''; F.cat = ''; F.tag = ''; F.fs = { st: [], pr: [], ug: [], star: false }; Q = ''; var q2 = root.querySelector('input[data-q]'); if (q2) q2.value = ''; keepF(); render(); return; }
    if (el.matches('[data-master]')) { MKIND = el.getAttribute('data-master') === 'tag' ? 'tag' : 'category'; SEL = '__master__'; ARM = ''; closeNav(); render(); return; }
    if (el.matches('[data-mkind]')) { MKIND = el.getAttribute('data-mkind'); ARM = ''; render(); return; }
    if (el.matches('[data-dir]')) { F.dir = F.dir === 'desc' ? 'asc' : 'desc'; keepF(); render(); return; }
    if (el.matches('[data-acc]')) { var ak = el.getAttribute('data-acc'); if (OPEN[ak]) delete OPEN[ak]; else OPEN[ak] = true; render(); return; }
    if (el.matches('[data-accall]')) {
      var vis = Array.prototype.map.call(root.querySelectorAll('tr.row'), function (r) { return r.getAttribute('data-key'); });
      if (vis.some(function (x) { return OPEN[x]; })) OPEN = {}; else vis.slice(0, 200).forEach(function (x) { OPEN[x] = true; });
      render(); return;
    }
    if (el.matches('[data-openpop]')) { SEL = el.getAttribute('data-openpop'); ARM = ''; MK = ''; NOEDIT = null; render(); return; }
    if (el.matches('[data-hsort]')) { var hs = el.getAttribute('data-hsort'); if (F.sort === hs) F.dir = F.dir === 'desc' ? 'asc' : 'desc'; else { F.sort = hs; F.dir = 'asc'; } keepF(); render(); return; }
    if (el.matches('[data-noedit]')) { NOEDIT = el.getAttribute('data-noedit'); render(); return; }
    if (el.matches('[data-fopen]')) { FOPEN = !FOPEN; render(); return; }
    if (el.matches('[data-fv]')) { var fl = F.fs[el.getAttribute('data-fg')], fv = el.getAttribute('data-fv'), fi = fl ? fl.indexOf(fv) : -1; if (!fl) return; if (fi >= 0) fl.splice(fi, 1); else fl.push(fv); keepF(); render(); return; }
    if (el.matches('[data-fstar]')) { F.fs.star = !F.fs.star; keepF(); closeNav(); render(); return; }
    if (el.matches('[data-fclear]')) { F.fs = { st: [], pr: [], ug: [], star: false }; keepF(); render(); return; }
    if (el.matches('[data-move]')) return moveTask(taskOf(SEL), el.getAttribute('data-move'));
    if (el.matches('[data-star]')) { var sv = taskOf(el.getAttribute('data-star')); if (!sv) return; return quickUpdate(sv, { star: !sv.star }, sv.star ? '星を外しました' : '「' + short(sv.name) + '」に星を付けました'); }
    // マスタの画面の行
    var mr = el.closest('.mrow');
    if (mr && SEL === '__master__') {
      var mn = mr.getAttribute('data-mname');
      if (el.matches('[data-mdel]')) return removeMaster(MKIND, mn);
      if (el.matches('[data-mmove]')) return moveMaster(MKIND, mn, el.getAttribute('data-mmove'));
      if (el.matches('[data-mnocolor]')) { colorMaster(MKIND, mn, ''); return; }
      if (el.matches('[data-madopt]')) { addMaster(MKIND, mn, ''); return; }
    }
    var cur = el.closest('.decide') ? taskOf(el.closest('.decide').getAttribute('data-key')) : taskOf(SEL);
    if (el.matches('[data-mk]')) { MK = el.getAttribute('data-mk'); render(); return; }
    if (el.matches('[data-mkgo]')) return makeAndSet(el.getAttribute('data-mkgo'));
    if (el.matches('[data-setcat]')) return setCat(cur, el.getAttribute('data-setcat'));
    if (el.matches('[data-settag]')) return toggleTag(cur, el.getAttribute('data-settag'));
    if (el.matches('[data-due]')) { var dv = el.getAttribute('data-due'); return quickUpdate(cur, { due: dv }, dv ? '「' + short(cur.name) + '」の期限を ' + md(dv) + ' にしました' : '期限なしにしました'); }
    if (el.matches('[data-pri]')) { var pv = el.getAttribute('data-pri'); return quickUpdate(cur, { priority: cur.priority === pv ? '' : pv }); }
    if (el.matches('[data-urg]')) { var uv = el.getAttribute('data-urg'); return quickUpdate(cur, { urgency: cur.urgency === uv ? '' : uv }); }
    if (el.matches('[data-color]')) { var cv = el.getAttribute('data-color'); if (!cur || cv === (cur.color || '')) return; return quickUpdate(cur, { color: cv }, cv ? '色を付けました' : '色を外しました'); }
    if (el.matches('[data-skip]')) { if (cur) SKIP[cur.key] = true; render(); return; }
    if (el.matches('[data-nodue]')) { if (!cur) return; SKIP[cur.key] = true; return quickUpdate(cur, { due: 'なし' }, '「' + short(cur.name) + '」は期限なしのままにしました（次から聞きません）'); }
    if (el.matches('[data-decide]')) { SEL = '__decide__'; SKIP = {}; ARM = ''; render(); return; }
    if (el.matches('[data-archivedone]')) return archiveDone();
    if (el.matches('[data-archive]')) return archiveTask(taskOf(SEL), true);
    if (el.matches('[data-unarchive]')) return archiveTask(taskOf(SEL), false);
    if (el.matches('[data-remove]')) return removeTask(taskOf(SEL));
    if (el.matches('[data-setup]')) return setup(el);
    if (el.matches('[data-logout]')) { Login.logout().then(function () { Login.screen('ログアウトしました。この端末のログインも消しました。', start); }); return; }
    if (el.matches('[data-setst]')) {
      var t = taskOf(SEL), st = el.getAttribute('data-setst');
      if (!t || st === t.status) return;
      if (isTeam(t) && t.status === DONE && ARM !== t.key + '|' + st) { ARM = t.key + '|' + st; render(); return; }
      return setStatus(t, st, isTeam(t) && t.status === DONE);
    }
    if (el.matches('tr.row')) {
      if (e.target.closest('select, a, input, [data-grip]') || Date.now() - JUST < 400) return;   // つまみで動かした直後の「押した」では開かない
      SEL = el.getAttribute('data-key'); ARM = ''; MK = ''; NOEDIT = null; render();
    }
  });
  document.addEventListener('change', function (e) {
    var x = e.target;
    if (x.matches('select[data-sort]')) { F.sort = x.value; F.dir = DESC_FIRST[F.sort] ? 'desc' : 'asc'; keepF(); render(); return; }
    if (x.matches('input[data-colorpick]')) { var cur = taskOf(SEL), c = String(x.value || '').toLowerCase(); if (cur && /^#[0-9a-f]{6}$/.test(c) && c !== (cur.color || '')) quickUpdate(cur, { color: c }, '色を付けました'); return; }
    if (x.matches('input[data-mcolor]')) { var r = x.closest('.mrow'); if (r) colorMaster(MKIND, r.getAttribute('data-mname'), String(x.value || '').toLowerCase()); return; }
    if (x.matches('input[data-mrename]')) { var r2 = x.closest('.mrow'); if (r2) renameMaster(MKIND, r2.getAttribute('data-mname'), x.value); return; }
    var s = x.closest('select[data-st]');
    if (s) setStatus(taskOf(s.getAttribute('data-st')), s.value, false);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'addForm') { e.preventDefault(); addTask(e.target); }
    if (e.target.id === 'editForm') { e.preventDefault(); editTask(e.target); }
    if (e.target.id === 'mAdd') { e.preventDefault(); var f = e.target; if (addMaster(MKIND, f.name.value, String(f.color.value || '').toLowerCase())) { f.name.value = ''; render(); var a = document.getElementById('mAdd'); if (a) a.name.focus(); } }
  });
  // 検索: 打つたびに一覧を絞る（少し待ってから描く。欄そのものは描き直さない）
  var QT = null;
  document.addEventListener('input', function (e) {
    var f = e.target.form; if (f && f.id === 'editForm') f.dataset.dirty = '1';
    if (e.target.matches && e.target.matches('input[data-q]')) { Q = e.target.value; clearTimeout(QT); QT = setTimeout(render, 120); }
  });
  // つまみでつかんで動かす（Yu 2026-10-27「並び替え機能」。マウスでも指でも。iPhone の Safari でも動くように、ブラウザのドラッグではなく指の動きで作る）
  function dropMarks() { root.querySelectorAll('.drop-a, .drop-b').forEach(function (x) { x.classList.remove('drop-a', 'drop-b'); }); }
  function rowAt(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return null;
    var r = el.closest('tr.row');
    if (!r) { var m = el.closest('tr.more'); if (m) r = m.previousElementSibling; }   // 開いた詳細の上なら、その行
    return r && r.matches('tr.row') ? r : null;
  }
  document.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('[data-grip]');
    if (!g || (e.button != null && e.button > 0) || !canDrag()) return;
    var row = g.closest('tr.row');
    if (!row) return;
    e.preventDefault();
    PD = { key: g.getAttribute('data-grip'), row: row, y: e.clientY, moved: false, id: e.pointerId, target: null, after: false };
    try { g.setPointerCapture(e.pointerId); } catch (x) { /* 古いブラウザ */ }
    row.classList.add('dragging'); document.body.classList.add('grabbing');
  });
  document.addEventListener('pointermove', function (e) {
    if (!PD || e.pointerId !== PD.id) return;
    e.preventDefault();
    if (Math.abs(e.clientY - PD.y) > 4) PD.moved = true;
    var r = rowAt(e.clientX, e.clientY);
    dropMarks(); PD.target = null;
    if (r && r !== PD.row && POS[r.getAttribute('data-key')]) {
      var b = r.getBoundingClientRect(), after = e.clientY > b.top + b.height / 2;
      r.classList.add(after ? 'drop-b' : 'drop-a'); PD.target = r.getAttribute('data-key'); PD.after = after;
    }
    if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);   // 端に来たら一覧を動かす
  });
  function endDrag(cancel) {
    var d = PD; PD = null;
    dropMarks(); root.querySelectorAll('.dragging').forEach(function (x) { x.classList.remove('dragging'); }); document.body.classList.remove('grabbing');
    if (!d) return;
    if (d.moved) JUST = Date.now();
    if (!cancel && d.moved && d.target) dropOrder(d.key, d.target, d.after);
  }
  document.addEventListener('pointerup', function (e) { if (PD && e.pointerId === PD.id) endDrag(false); });
  document.addEventListener('pointercancel', function (e) { if (PD && e.pointerId === PD.id) endDrag(true); });
  document.addEventListener('keydown', function (e) {
    var x = e.target;
    if (x.matches && x.matches('input[data-noin]')) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commitNo(x); }
      else if (e.key === 'Escape') { e.preventDefault(); NOEDIT = null; render(); }
      return;
    }
    if (x.matches && x.matches('input[data-mkname]')) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); makeAndSet(x.getAttribute('data-mkname')); }
      else if (e.key === 'Escape') { e.preventDefault(); MK = ''; render(); }
      return;
    }
    if (x.matches && x.matches('input[data-mrename]') && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); x.blur(); return; }
    if (x.matches && x.matches('input[data-q]')) {
      if (e.key === 'Escape' && !e.isComposing) { e.preventDefault(); if (Q) { Q = ''; x.value = ''; render(); } else x.blur(); }
      return;
    }
    if (e.key === 'Escape' && PD) { endDrag(true); return; }
    if (e.key === 'Escape' && NAV && !e.isComposing) { NAV = false; render(); return; }
    if (e.key === 'Escape' && SEL && !e.isComposing) { SEL = null; ARM = ''; MK = ''; render(); return; }
    // 「/」で検索の欄へ（何かを打っている時は除く）
    if (e.key === '/' && !SEL && !(x.matches && x.matches('input, textarea, select, [contenteditable]'))) { var qi = root.querySelector('input[data-q]'); if (qi) { e.preventDefault(); qi.focus(); } }
  });
  document.addEventListener('focusout', function (e) { if (e.target.matches && e.target.matches('input[data-noin]')) commitNo(e.target); });
  // 開いている間は 5 分おきに、戻ってきた時は 1 分たっていれば読み直す（中身を開いている時・番号を直している時・保存を送っている間はしない）
  setInterval(function () { if (document.visibilityState === 'visible' && D && !SEL && !NOEDIT && !PEND && !PD && !Object.keys(BUSY).length) refresh(); }, 5 * 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && D && !SEL && !NOEDIT && !PEND && Date.now() - LAST > 60000) refresh(); });

  // スマホで案内の欄を開いたまま、広い画面になった時（横向き・窓を広げた）は閉じる
  window.addEventListener('resize', function () { if (NAV && window.innerWidth > 900) { NAV = false; render(); } });

  function start() { refresh(); }
  if (WS.mock) start();
  else if (!WS.exec || !WS.clientId) root.innerHTML = '<div class="login card"><h2>まだ使えません</h2><p>GAS の窓口か、ログインの入口の設定が入っていません。</p></div>';
  else if (Login.restore()) start();
  else Login.screen('', start);
})();
</script>
</body>
</html>
